  <body>
    <!--
      DIRECTION C · TYPE IT — one command field is the navigation
      THESIS: Mid-draft you know the matchup; say it. "ra vs hecate ymir" is the
        whole query, and the answer is Ra's six re-ranked for that team.
      OWN-WORLD: Direction A's Thermal Ink and broadcast caps. The query becomes
        chips: you in violet, enemies in ink outline, mode and aspect as plain chips.
      STORY: Type three letters per god (or tap a portrait row), Enter, read the verdict
        and six. The link reproduces the chips; recents make the next draft one tap.
      FIRST VIEWPORT: Landing: "Type your matchup", the grammar as chips, recents, then the
        roster. God page: header, verdict, starter, the six; the field docks at the
        phone's bottom holding the team as faces.
      FORM: Field in a top bar on desktop, docked at the bottom on a phone above the keyboard;
        Menu holds every other route. No tab bar.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
