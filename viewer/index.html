    <!--
      DIRECTION A · SECOND SCREEN — god first
      THESIS: The phone beside the monitor, mid-draft. One answer per screen: who you are
        playing, the six to buy in order, and how the enemy team bends it.
      OWN-WORLD: Thermal Ink, dark only. Broadcast lower-third caps (Sofia Sans Extra
        Condensed) over Sofia Sans; violet is the model's voice and the only hue; the enemy
        is an ink outline and the word "Enemy". Gold and percent of players are the only numbers.
      STORY: Open on "Who are you playing?", tap your god, read one sentence and six rows.
        As the enemy locks in, tap a slot, type three letters, and a row locks in with its reason.
      FIRST VIEWPORT: god header, the verdict sentence, the starter, five of six items with
        gold spent, the enemy strip riding above the tab bar.
      FORM: god-first single column with a bottom tab bar on a phone; on desktop a slim top
        bar and a real second column (enemy team + why). The full draft board is its own tab.
    -->
