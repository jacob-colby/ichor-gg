# Run the new-entity add path (`smite.new_entities`) on its own, from a runner.
#
# The daily `refresh-data.yml` runs the same step every morning; this exists to
# run it on a FEATURE BRANCH, where the result is committed back to that branch
# for review — which is how the first four (Nike, Hachiman, Kuzenbo, Hel) came
# in. The sandbox sessions cannot reach wiki.smite2.com; a runner can. Never
# commits to main: there the daily job is the only writer.
name: Add new wiki entities

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/add-new-entities.yml"

concurrency:
  group: add-new-entities-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8"
      - name: Add new gods and items from the wiki
        id: new_entities
        working-directory: pipeline
        run: python -m smite.new_entities
      - name: Recompute builds and rebuild the index
        working-directory: pipeline
        run: |
          python -m smite.recommend --all
          python -m smite.build_index
      - name: Quality gate
        working-directory: pipeline
        run: python -m smite.validate --check
      - name: Combat model gate
        working-directory: pipeline
        run: python -m smite.calibrate_combat
      - name: Commit to the branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data viewer/public/index.json
          git reset -q -- data/_cache
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "feat(data): add new gods and items from the wiki (smite.new_entities, live run)"
          git push
