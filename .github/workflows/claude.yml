name: Claude

# Runs Claude Code when Jacob mentions @claude in a new issue or a comment.
# The repo is public, so only Jacob's own issues and comments start it.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude:
    if: >-
      (github.event_name == 'issues'
        && github.event.issue.user.login == 'jacob-colby'
        && contains(github.event.issue.body, '@claude'))
      || (github.event_name == 'issue_comment'
        && github.event.comment.user.login == 'jacob-colby'
        && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # gh pr create is allowed so Claude opens the PR itself. It runs with the
          # Claude app's token, so the PR triggers Tests and the "PR ready" post.
          claude_args: |
            --allowedTools "Bash(gh pr create:*)"
            --append-system-prompt "This task came from Jacob through his Discord bot. If you need a decision from him before you can go on, end your reply with a line that is exactly 'Decision needed:' followed by one short question and numbered options (1, 2, 3), and stop there. He answers with a comment starting '@claude Jacob's answer:'. When the work is done and committed, open the pull request yourself: gh pr create --base main --head <your branch> --title '<short title>' --body 'Closes #<issue number>. <one-line summary>'. Then link the PR in your reply. Never merge, never push to main."
