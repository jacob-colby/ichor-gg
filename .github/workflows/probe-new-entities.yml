# Record the wiki pages the new-entity path reads (roster, Items index, every
# untracked god and item), from a runner. Read-only against the wiki.
#
# DISPATCH ONLY, AND IT NEVER COMMITS. It used to run on every feature-branch
# push touching this file or the probe script and commit what it recorded.
# "Untracked" is decided against the live `data/` at probe time, so once PR #70
# added Nike, Hachiman, Kuzenbo and Hel the next re-record dropped all four from
# `index.json` (f454b88, reaching main via #71) and turned 17 tests in
# `test_new_entities` red, and it then pushed the same re-record onto an
# unrelated branch (cff891a, #73). Those fixtures are fixed inputs: the tests
# were written against the 0fd5b9d recording and `_forget_items` exists so they
# keep passing as the live pool grows. Re-recording is a deliberate human step:
# dispatch this, download the `new-entities` artifact, and commit it alongside
# the test changes it needs.
name: Probe new wiki entities

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: pipeline
        run: pip install -r requirements.txt
      - name: Probe
        working-directory: pipeline
        run: python scripts/probe_new_entities.py
      - uses: actions/upload-artifact@v4
        with:
          name: new-entities
          path: pipeline/smite/tests/fixtures/recorded/new_entities
