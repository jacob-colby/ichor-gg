# Daily data refresh: community numbers every day, wiki stats when a patch lands.
#
# TWO SOURCES, TWO CADENCES.
#
#   smitebrain.com   plain HTTP, no bot protection, numbers move every day —
#                    win rates, pick rates, builds, starters. Every run.
#   wiki.smite2.com  item stats and god kits. Only changes on patch days, so
#                    `smite.stats_refresh` fetches it only when `patch_feed`
#                    or the wiki's own Patch_notes index names a patch newer
#                    than the item data (or weekly). It is plain HTTP with an honest User-Agent:
#                    Cloudflare challenges clients posing as a browser, not
#                    ones that say what they are (measured from a runner,
#                    2026-11-02 — see that module's docstring). All-or-nothing
#                    and validated before it writes; it never fails the job.
#
# THE TEST GATE. A stats refresh is kept only if the full pytest suite still
# passes on it (`smite.stats_gate`). A test that fails on the new stats and
# passes on the old puts the OLD stats back, prints each such test as an
# ::error::, lets the community data commit anyway, and then fails the run at
# its last step — so a rejection is loud (red run, owner emailed) and never
# costs the day's community numbers. The gate runs only on a day the stats
# actually changed; on every other day it makes no test run.
#
# New gods and items are still added by hand: `stats_refresh` refreshes what is
# tracked, and `watch-wiki.yml` announces what is not.
name: Refresh community data

on:
  schedule:
    # 09:15 UTC daily. Deliberately not on the hour: GitHub's scheduler queues
    # heavily at :00 and a job can be delayed or dropped entirely at peak.
    - cron: "15 9 * * *"
  workflow_dispatch:

# Never let two refreshes race for the same commit.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A patch day is ~14 min of wiki fetches plus up to three suite runs.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8"

      - name: Pull community data
        working-directory: pipeline
        run: python -m smite.refresh --community

      # The game's patch label, from Steam's announcement feed (the wiki is
      # Cloudflare-gated and stays a manual patch-day step). Records a new
      # patch and its official link when there is one; changes nothing
      # otherwise. Exits 0 on every path — a Steam outage must not cost the
      # day's community data. See smite/patch_feed.py.
      - name: Detect a new game patch
        working-directory: pipeline
        run: python -m smite.patch_feed

      # Wiki item and god stats, when a patch landed (or weekly). Runs after
      # patch detection, which it keys off, and before the snapshot, so a
      # patch's stat changes are banked as that patch's notes the same run.
      # Not due: one request (the wiki's Patch_notes index — the second due
      # signal, for patches Steam's feed misses). Due: ~317 page loads at a
      # 2.5s floor, ~14 min (measured 2026-11-02). Any
      # fetch failure or validation problem writes nothing and prints a
      # ::warning:: — exit 0 on every path, like patch_feed.
      - name: Set the current stats aside
        working-directory: pipeline
        run: python -m smite.stats_gate save "$RUNNER_TEMP/stats_before"

      - name: Refresh wiki stats if a patch landed
        working-directory: pipeline
        run: python -m smite.stats_refresh

      # Before the snapshot, so a rejected refresh banks no patch notes. Exits
      # 0 whenever it could put the old stats back (a rejection is reported by
      # the `rejected` output and the last step); exits 1 only if it could NOT,
      # which stops the job before anything is committed.
      - name: Test gate — keep the new stats only if the suite still passes
        id: stats_gate
        working-directory: pipeline
        run: python -m smite.stats_gate check "$RUNNER_TEMP/stats_before"

      # Patch notes are a diff between two item-stat snapshots, and until this
      # step existed nothing on any schedule wrote one: `write_snapshot` was
      # called from `refresh_and_deploy` alone, which is a manual patch-day
      # command. The store held a single file from 2026-08-01, a diff needs
      # two, and `patch_notes` had therefore been `[]` since the page shipped.
      #
      # Runs BEFORE the index, because the index reads the store. It banks a
      # file only when item cost/tier/stats actually moved — see the module
      # docstring for why writing one every morning would be worse than none.
      - name: Bank an item-stat snapshot if items moved
        working-directory: pipeline
        run: python -m smite.snapshots

      - name: Recompute builds and rebuild the index
        working-directory: pipeline
        run: |
          python -m smite.recommend --all
          python -m smite.build_index

      # The gates. `data_audit` exits non-zero on any finding and currently has
      # three standing ones that are properties of the source data, not defects
      # (Blink Rune's zero cost, two statless tier-2 items) — so its result is
      # reported, not enforced. `validate --check` is a regression floor and IS
      # enforced: a scrape that silently returns garbage shows up here first.
      - name: Data audit (advisory)
        working-directory: pipeline
        continue-on-error: true
        run: python -m smite.data_audit

      # Advisory, like data_audit. A patch can move a resolved expert claim
      # with no model change at all (Open Beta 46 put Eye of Providence back
      # into 4 support cores), and re-baselining that is a human's call — so it
      # is printed as a warning on the run rather than holding a patch's stats
      # hostage. See `verdict_patch` in data/_expert_reviews.yaml.
      - name: Expert-review regressions (advisory)
        working-directory: pipeline
        run: |
          python -m smite.expert_review --check > "$RUNNER_TEMP/expert.txt" 2>&1 || {
            cat "$RUNNER_TEMP/expert.txt"
            grep '^REGRESSED' "$RUNNER_TEMP/expert.txt" | sed 's/^/::warning::/'
            exit 0
          }
          cat "$RUNNER_TEMP/expert.txt"

      - name: Quality gate
        working-directory: pipeline
        run: python -m smite.validate --check

      - name: Combat model gate
        working-directory: pipeline
        run: python -m smite.calibrate_combat

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The HTML cache is a fetch artifact, not data — committing it would
          # add tens of MB a day for nothing.
          git add data viewer/public/index.json
          git reset -q -- data/_cache
          if git diff --cached --quiet; then
            echo "No change — SmiteBrain's window hasn't moved."
            exit 0
          fi
          git commit -m "chore(data): daily community refresh

          Automated. SmiteBrain win/pick rates, community builds and starters,
          wiki item and god stats when a patch landed (smite.stats_refresh),
          then a recompute and reindex."
          git push

      # Last, so the community data above is committed first. A rejected
      # stats refresh fails the run here, with the failing tests already
      # printed as ::error:: annotations by the gate step.
      - name: Fail the run if the stats refresh was rejected
        if: steps.stats_gate.outputs.rejected == 'true'
        run: |
          echo "::error::The wiki stats refresh was rejected by the test gate; the old stats are still live. See the 'Test gate' step."
          exit 1
