# Daily data refresh: community numbers every day, wiki stats when a patch lands.
#
# TWO SOURCES, TWO CADENCES.
#
#   smitebrain.com   plain HTTP, no bot protection, numbers move every day —
#                    win rates, pick rates, builds, starters. Every run.
#   wiki.smite2.com  item stats and god kits. Only changes on patch days, so
#                    `smite.stats_refresh` fetches it only when `patch_feed`
#                    or the wiki's own Patch_notes index names a patch newer
#                    than the item data (or weekly). It is plain HTTP with an honest User-Agent:
#                    Cloudflare challenges clients posing as a browser, not
#                    ones that say what they are (measured from a runner,
#                    2026-11-02 — see that module's docstring). All-or-nothing
#                    and validated before it writes; it never fails the job.
#
# THE TEST GATE. A stats refresh is kept only if the full pytest suite still
# passes on it (`smite.stats_gate`). A test that fails on the new stats and
# passes on the old puts the OLD stats back, prints each such test as an
# ::error::, lets the community data commit anyway, and then fails the run at
# its last step — so a rejection is loud (red run, owner emailed) and never
# costs the day's community numbers. The gate runs only on a day the stats
# actually changed; on every other day it makes no test run.
#
# NEW GODS AND ITEMS. `smite.new_entities` adds any god on the wiki's roster
# grid, or item on its Items index, that `data/` does not track yet — whole or
# not at all (a page that does not parse cleanly is left out and logged), with
# an unclassified passive added as `uncatalogued` (stat-only, flagged), and
# behind the same kind of gate: the suite plus `validate --check` and
# `calibrate_combat`, with any entity that turns a check red left out and the
# rest kept. A left-out entity fails the run at its last step, like a rejected
# stats refresh. `watch-wiki.yml` still announces what is not tracked.
name: Refresh community data

on:
  schedule:
    # 09:15 UTC daily. Deliberately not on the hour: GitHub's scheduler queues
    # heavily at :00 and a job can be delayed or dropped entirely at peak.
    - cron: "15 9 * * *"
  workflow_dispatch:

# Never let two refreshes race for the same commit.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write
  # The run opens a pull request instead of pushing to main; see the last
  # commit step for why.
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A patch day is ~14 min of wiki fetches plus up to three suite runs; a day
    # with new gods or items adds up to two more, plus one recompute per
    # candidate if one of them turns a check red.
    timeout-minutes: 120
    steps:
      # `persist-credentials: false` so NO push credential is left in
      # .git/config for the rest of the job. The alternative is handing
      # checkout the PAT, which is the conventional shape and works, but it
      # leaves a long-lived token readable by everything that runs afterwards
      # — and what runs afterwards is `pip install -r requirements.txt` plus
      # up to two hours of third-party fetching. The capability is not the
      # worry, since this job's GITHUB_TOKEN already carries contents and
      # pull-requests write; the LIFETIME is. A leaked GITHUB_TOKEN dies with
      # the run, a leaked PAT lives until someone revokes it. So the PAT is
      # used at the one point that needs it, the push, and nowhere else.
      #
      # The later `git fetch origin "$BRANCH"` and `git ls-remote origin`
      # still work unauthenticated because this repository is public.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8"

      # Reads ONE match window for the whole run, chosen by
      # `refresh.choose_community_window`: the newest patch window that covers
      # as much of the roster as the one before it, a tie going to the newer.
      # SmiteBrain's pages default to the newest patch and that window opens
      # the hour the patch lands, so the default is unusable for a day or two
      # after one — on 2026-11-04 it was 529 matches over 86 gods against Open
      # Beta 46's 67,532 over 94, and the run committed it.
      #
      # THE STEP NOW FAILS instead of committing a roster-wide thinning
      # (`refresh._refuse_community_collapse`): more than one god losing a
      # complete six-slot community record stops the job HERE, before the
      # recompute and before the commit, with the day's notes left as they
      # were. That is the gap the 2026-11-04 run went through — the one
      # enforced gate below is `validate --check`, and it PASSED, because its
      # Spearman floor is window-aware by design and relaxes to 0.30 for
      # exactly the young window that caused the damage. A genuine roster
      # change is `--allow-shrink`, by hand.
      - name: Pull community data
        working-directory: pipeline
        run: python -m smite.refresh --community

      # What aspect PLAYERS buy, per match, into data/Analysis/aspect_matches
      # and each Conquest note's `community_aspects`. ~217 requests at a 2.5s
      # floor, ~9 min (measured 2026-11-08): the newest two windows' split
      # index, one no-aspect page per god, and every aspect feed walked back to
      # the newest match already stored. All or nothing: a page it does not
      # trust writes nothing, and the walk recovers the day on the next run, so
      # a refusal must not cost the rest of the day's data. It sets `rejected`
      # and the last step turns the run red. See smite/aspect_matches.py.
      - name: Pull per-aspect match records
        id: aspect_feed
        working-directory: pipeline
        run: |
          if ! python -m smite.aspect_matches refresh; then
            echo "rejected=true" >> "$GITHUB_OUTPUT"
          fi

      # The game's patch label, from Steam's announcement feed — read from
      # the title, the official notes link or the body, since Hi-Rez stopped
      # titling posts with it (measured on a recorded response, 2026-11-02).
      # The weaker of the two patch sources now; `stats_refresh` cross-checks
      # it against the wiki daily. Records a new patch and its official link
      # when there is one. Exits 0 on every path — a Steam outage must not
      # cost the day's community data. See smite/patch_feed.py.
      - name: Detect a new game patch
        working-directory: pipeline
        run: python -m smite.patch_feed

      # Wiki item and god stats, when a patch landed (or weekly). Runs after
      # patch detection, which it keys off, and before the snapshot, so a
      # patch's stat changes are banked as that patch's notes the same run.
      # Not due: one request (the wiki's Patch_notes index — the second due
      # signal, for patches Steam's feed misses). Due: ~317 page loads at a
      # 2.5s floor, ~14 min (measured 2026-11-02). Any
      # fetch failure or validation problem writes nothing and prints a
      # ::warning:: — exit 0 on every path, like patch_feed.
      - name: Set the current stats aside
        working-directory: pipeline
        run: python -m smite.stats_gate save "$RUNNER_TEMP/stats_before"

      - name: Refresh wiki stats if a patch landed
        working-directory: pipeline
        run: python -m smite.stats_refresh

      # Before the snapshot, so a rejected refresh banks no patch notes. Exits
      # 0 whenever it could put the old stats back (a rejection is reported by
      # the `rejected` output and the last step); exits 1 only if it could NOT,
      # which stops the job before anything is committed.
      - name: Test gate — keep the new stats only if the suite still passes
        id: stats_gate
        working-directory: pipeline
        run: python -m smite.stats_gate check "$RUNNER_TEMP/stats_before"

      # After the stats gate, so the tracked stats are settled and the two
      # gates never blame each other's change. Discovery is two page loads
      # (the roster grid and the Items index) plus one per untracked entry,
      # capped at 12. Nothing new: no test run. Something new: the gate runs
      # the suite and the two numeric gates on it (see that module). Exits 0
      # on every path; a left-out entity sets `rejected` for the last step.
      - name: Add new gods and items from the wiki
        id: new_entities
        working-directory: pipeline
        run: python -m smite.new_entities

      # Patch notes are a diff between two item-stat snapshots, and until this
      # step existed nothing on any schedule wrote one: `write_snapshot` was
      # called from `refresh_and_deploy` alone, which is a manual patch-day
      # command. The store held a single file from 2026-08-01, a diff needs
      # two, and `patch_notes` had therefore been `[]` since the page shipped.
      #
      # Runs BEFORE the index, because the index reads the store. It banks a
      # file only when item cost/tier/stats actually moved — see the module
      # docstring for why writing one every morning would be worse than none.
      - name: Bank an item-stat snapshot if items moved
        working-directory: pipeline
        run: python -m smite.snapshots

      - name: Recompute builds and rebuild the index
        working-directory: pipeline
        run: |
          python -m smite.recommend --all
          python -m smite.build_index
          # Criterion 2's side-by-side, per god, for the god page. A diagnostic:
          # it reads the builds just written and feeds nothing back.
          python -m smite.side_by_side --json
          # The god page's "Recent builds": the newest matches the aspect store
          # holds, per god, trimmed to what the page filters. Data, no model.
          python -m smite.recent_builds

      # The gates. `data_audit` exits non-zero on any open finding; reviewed
      # source-data facts live in data/_audit_reviewed.yaml, so it exits 0 as of
      # 2026-11-02. Still reported, not enforced, until it has stayed green
      # across a patch. `validate --check` is a regression floor and IS
      # enforced: a scrape that silently returns garbage shows up here first.
      - name: Data audit (advisory)
        working-directory: pipeline
        continue-on-error: true
        run: python -m smite.data_audit

      # Advisory, like data_audit. A patch can move a resolved expert claim
      # with no model change at all (Open Beta 46 put Eye of Providence back
      # into 4 support cores), and re-baselining that is a human's call — so it
      # is printed as a warning on the run rather than holding a patch's stats
      # hostage. See `verdict_patch` in data/_expert_reviews.yaml.
      - name: Expert-review regressions (advisory)
        working-directory: pipeline
        run: |
          python -m smite.expert_review --check > "$RUNNER_TEMP/expert.txt" 2>&1 || {
            cat "$RUNNER_TEMP/expert.txt"
            grep '^REGRESSED' "$RUNNER_TEMP/expert.txt" | sed 's/^/::warning::/'
            exit 0
          }
          cat "$RUNNER_TEMP/expert.txt"

      - name: Quality gate
        working-directory: pipeline
        run: python -m smite.validate --check

      - name: Combat model gate
        working-directory: pipeline
        run: python -m smite.calibrate_combat

      # OPENS A PULL REQUEST. IT DOES NOT PUSH TO MAIN, AND IT MUST NOT.
      #
      # This step used to end in a bare `git push` to main, and that stopped
      # working the moment a branch ruleset went on main. The run then failed
      # every day, silently as far as the data was concerned: a red cross on a
      # scheduled workflow nobody was watching, while the community window sat
      # frozen wherever it last landed. 2026-11-05 through 2026-11-07, three
      # days, with the only data to arrive in that span coming through a
      # hand-made PR (#117). The error is worth quoting, because its shape is
      # what to look for if this ever regresses:
      #
      #   remote: error: GH013: Repository rule violations found for
      #   refs/heads/main ... 2 of 2 required status checks are expected
      #   ! [remote rejected] main -> main
      #
      # A bypass actor on the ruleset would also have fixed it. A pull request
      # is better and not merely equivalent: `tests.yml` runs on
      # `pull_request`, so the day's data now faces the full suite before it
      # lands, which a direct push to main never did. The gates in this job
      # run on the data; the suite runs on the result.
      #
      # ONE OPEN DATA PR PER DAY, AND A RE-RUN STACKS ONTO IT ONLY WHILE IT
      # IS OPEN. The cron says 09:15 but GitHub has run it 6-7 hours late
      # (11-06 at 16:43Z, 11-07 at 15:38Z, 11-08 at 15:55Z), so a hand
      # dispatch and the scheduled run landing on one UTC day is an ordinary
      # day. What a run does is decided by the day's OPEN pull request from a
      # branch of THIS repository (it is public, and a fork can name a branch
      # data-refresh-<day> too):
      #
      #   an open PR from data-refresh-<day>, or from one of its re-run
      #   branches data-refresh-<day>-run<N>-<attempt>
      #       stack onto the newest: fetch its branch, `git reset --soft`,
      #       commit, push. `reset --soft` moves HEAD to the branch tip and
      #       leaves the staged data where it is, so the new commit is an
      #       ordinary child, an ordinary push takes it, NOTHING is ever
      #       force-pushed, and the PR updates in place.
      #   no open PR, and no data-refresh-<day> on origin
      #       the day's first run: push that branch, open its PR.
      #   no open PR, but data-refresh-<day> exists (its PR merged or closed)
      #       a NEW branch, data-refresh-<day>-run<N>-<attempt>, cut from the
      #       main this job checked out, and a new PR from it.
      #
      # THE THIRD ROW USED TO BE WRONG, and it fired on 2026-11-08. The lookup
      # was `gh pr view <branch>`, which finds a PR by head name IN ANY STATE
      # (`gh pr view data-refresh-2026-11-06` prints `117 MERGED`). Run
      # 42497271128 therefore pushed the afternoon's data onto the branch #124
      # had already merged from (9b8ca711, in no PR), opened nothing, and
      # called `gh pr merge 124 --auto --merge` — which EXITS 0 on a merged
      # PR. So the run went GREEN saying auto-merge was armed. Deleting merged
      # branches would not have fixed it, since the lookup went by name; with
      # that setting on, the branch is gone and the second row applies.
      # Every row is run, not just read, in `test_workflows.py`.
      #
      # AUTO-MERGE IS ARMED, NOT ASSUMED, AND `gh`'s EXIT CODE IS NOT THE
      # VERDICT — the PR's state read back afterwards is. A PR that is not
      # armed afterwards stays open and the last step fails the run, naming
      # which of three things happened: no PAT; GitHub refused to arm an OPEN
      # PR (with what gh said); or the PR stopped being open before it could
      # be armed. A PR that merged with this run's commit in it has landed and
      # is not a failure. A rejected stats refresh or a left-out entity still
      # fails the run at the steps below and still does not cost the day's
      # community numbers: they are in the PR.
      #
      # WHICH TOKEN. GitHub starts no workflow run for an event caused by
      # `secrets.GITHUB_TOKEN` (`workflow_dispatch` and `repository_dispatch`
      # aside), so a PR opened or pushed with it gets no `pull_request` run,
      # "Pipeline suite" and "Viewer suite and build" stay expected, and the
      # `main` ruleset, which has ZERO bypass actors, can never be satisfied
      # — by auto-merge or by hand, by anyone. Hence `REFRESH_PAT`: a
      # fine-grained PAT scoped to this repository alone, Contents and Pull
      # requests at read/write, no Workflows permission (the refresh never
      # edits a workflow file), used for BOTH the push and `gh`, because
      # `opened` and `synchronize` are both `pull_request` events. It exists,
      # and "Allow auto-merge" is on, since 2026-11-08: the first run with
      # both (42491434574) opened #124 with checks and auto-merge armed.
      #
      # WITHOUT THE SECRET THIS STILL RUNS. The step falls back to
      # GITHUB_TOKEN, pushes, opens the PR anyway so the day's data is not
      # thrown away, skips arming because a checkless PR can never satisfy
      # it, and the last step fails the run saying the PAT is missing.
      #
      # Every refresh PR faces the full suite, so a test pinning a
      # window-dependent value (the four OB46 pins #117 had to move, and the
      # viewer counts) blocks the day's data at each window reset.
      - name: Open a pull request if anything moved
        id: data_pr
        env:
          # Both, so the step can tell whether the PAT exists and degrade
          # gracefully rather than dying on an empty credential. GitHub masks
          # either value if it reaches the log.
          REFRESH_PAT: ${{ secrets.REFRESH_PAT }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The HTML cache is a fetch artifact, not data — committing it would
          # add tens of MB a day for nothing.
          git add data viewer/public/index.json viewer/public/side_by_side viewer/public/recent
          git reset -q -- data/_cache
          if git diff --cached --quiet; then
            echo "No change — SmiteBrain's window hasn't moved."
            echo "No change: SmiteBrain's window had not moved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Read once, so a run that straddles UTC midnight cannot push to one
          # day's branch and title the PR with the next.
          DAY=$(date -u +%Y-%m-%d)
          DAY_BRANCH="data-refresh-$DAY"

          # WHICH TOKEN PUSHES DECIDES WHETHER THE PR GETS CHECKS AT ALL.
          # The `pull_request` events that start `tests.yml` are `opened`,
          # from `gh pr create`, and `synchronize`, from this push on a
          # same-day re-run. GitHub starts no workflow run for either when
          # GITHUB_TOKEN caused it, so both have to be the PAT.
          #
          # With no PAT we still push and still open the PR, with
          # GITHUB_TOKEN, because the day's data surviving on a branch beats
          # losing it. That PR just gets no checks and so cannot be merged,
          # which the last step reports as a failure.
          if [ -n "${REFRESH_PAT:-}" ]; then
            TOKEN="$REFRESH_PAT"
            echo "token=pat" >> "$GITHUB_OUTPUT"
          else
            TOKEN="$FALLBACK_TOKEN"
            echo "token=github_token" >> "$GITHUB_OUTPUT"
            echo "::warning::REFRESH_PAT is not set, so this PR will get no checks and cannot be merged. Pushing with GITHUB_TOKEN anyway so the day's data is not lost."
          fi
          export GH_TOKEN="$TOKEN"

          # Every OPEN pull request into main from a branch of THIS
          # repository, oldest first, one "<number> <branch>" per line. OPEN,
          # because a merged or closed PR cannot take more data. THIS
          # repository, because it is public and a fork's PR can come from a
          # branch of the same name, which must never be stacked onto or armed
          # with the PAT. A failed lookup stops the step (`set -e`) rather than
          # being read as "no PR", which is how a duplicate would get opened.
          open_prs() {
            gh pr list --state open --base main --limit 100 \
              --json number,headRefName,isCrossRepository \
              --jq 'map(select(.isCrossRepository | not)) | sort_by(.number) | .[] | "\(.number) \(.headRefName)"'
          }

          # The table in the comment above, row by row. `-run*` and not `-*`:
          # only branches this workflow makes, never a person's
          # data-refresh-<day>-something.
          OPEN=$(open_prs)
          STACK_ON=""
          while read -r _ head; do
            case "$head" in
              "$DAY_BRANCH"|"$DAY_BRANCH"-run*) STACK_ON="$head" ;;
            esac
          done <<< "$OPEN"
          if [ -n "$STACK_ON" ]; then
            BRANCH="$STACK_ON"
            echo "Stacking onto $BRANCH: its pull request is still open."
            git fetch -q origin "$BRANCH"
            git reset -q --soft FETCH_HEAD
          else
            DAY_ON_ORIGIN=$(git ls-remote --heads origin "refs/heads/$DAY_BRANCH")
            if [ -z "$DAY_ON_ORIGIN" ]; then
              BRANCH="$DAY_BRANCH"
            else
              BRANCH="$DAY_BRANCH-run${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
              echo "::notice::$DAY_BRANCH is on origin with no open pull request (its PR merged or closed), so this run's data goes to $BRANCH, cut from main, in a pull request of its own."
            fi
          fi

          if git diff --cached --quiet; then
            echo "$BRANCH already carries this data."
          else
            git commit -q -F- <<'MSG'
          chore(data): daily community refresh

          Automated. SmiteBrain win/pick rates, community builds and starters,
          wiki item and god stats when a patch landed (smite.stats_refresh),
          new gods and items from the wiki (smite.new_entities), then a
          recompute and reindex.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          MSG
          fi
          git push -q \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH"
          PUSHED=$(git rev-parse HEAD)
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # Looked up again AFTER the push, by exact branch: the PR stacked
          # onto can merge or close while this run works, and then the branch
          # needs a new one. `gh pr create` prints the new PR's URL.
          NUM=""
          OPEN=$(open_prs)
          while read -r n head; do
            if [ "$head" = "$BRANCH" ]; then NUM="$n"; fi
          done <<< "$OPEN"
          if [ -z "$NUM" ]; then
            TITLE="chore(data): daily community refresh $DAY"
            BODY="Automated by \`Refresh community data\` ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})). SmiteBrain win/pick rates, community builds and starters, wiki item and god stats if a patch landed, new gods and items, then a recompute and reindex.

          This is a pull request rather than a push to \`main\` because the branch ruleset refuses a direct push. The suite runs on it before it lands, which a direct push never allowed."
            if [ "$BRANCH" != "$DAY_BRANCH" ]; then
              TITLE="$TITLE (run $GITHUB_RUN_NUMBER)"
              BODY="$BODY

          Today's first data PR, from \`$DAY_BRANCH\`, was no longer open when this run finished, so this run's data comes in a second one, from a branch cut from \`main\`."
            fi
            BODY="$BODY

          🤖 Generated with [Claude Code](https://claude.com/claude-code)"
            URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY")
            NUM="${URL##*/}"
          fi
          case "$NUM" in
            ''|*[!0-9]*)
              echo "::error::No pull request number for $BRANCH (gh printed '${URL:-}')."
              exit 1 ;;
          esac
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

          # ARMED, NOT ASSUMED, AND READ BACK. `gh pr merge --auto` EXITS 0 ON
          # A MERGED PR (run 42497271128, 2026-11-08, armed nothing and went
          # green), so its exit code is not the verdict: the state read after
          # it is. `--merge` and not `--squash`: every merge on main in this
          # repository is a merge commit, and a data PR should read the same
          # as the ones a person opens.
          #
          # A stuck PR carries WHICH cause in `stuck`, for the last step:
          #   no_pat       REFRESH_PAT is unset, so the PR has no checks
          #   arm_refused  the PR is OPEN and GitHub would not arm it;
          #                `arm_error` is what gh said
          #   not_open     the PR merged without this run's commit, or closed,
          #                before it could be armed: not an auto-merge problem
          pr_now() {
            gh pr view "$NUM" --json state,autoMergeRequest,headRefOid \
              --jq '"\(.state) \(.autoMergeRequest != null) \(.headRefOid)"'
          }
          stuck() {
            echo "landed=stuck" >> "$GITHUB_OUTPUT"
            echo "stuck=$1" >> "$GITHUB_OUTPUT"
            echo "$2 See the last step." >> "$GITHUB_STEP_SUMMARY"
          }
          if [ -z "${REFRESH_PAT:-}" ]; then
            # No point arming auto-merge on a PR that can never get a check.
            stuck no_pat "#$NUM holds today's data and has no checks, because REFRESH_PAT is not set."
          else
            NOW=$(pr_now)
            read -r STATE ARMED HEAD_OID <<< "$NOW"
            ARM_SAID=""
            if [ "$STATE" = OPEN ] && [ "$ARMED" != true ]; then
              if ARM_OUT=$(gh pr merge "$NUM" --auto --merge 2>&1); then ARM_RC=0; else ARM_RC=$?; fi
              ARM_SAID="gh pr merge exited $ARM_RC: $(printf '%s' "$ARM_OUT" | tr '\r\n' '  ')"
              NOW=$(pr_now)
              read -r STATE ARMED HEAD_OID <<< "$NOW"
            fi
            echo "pr_state=$STATE" >> "$GITHUB_OUTPUT"
            if [ "$STATE" = OPEN ] && [ "$ARMED" = true ]; then
              echo "landed=armed" >> "$GITHUB_OUTPUT"
              echo "Auto-merge is armed on #$NUM ($BRANCH); it lands when the suite passes." \
                >> "$GITHUB_STEP_SUMMARY"
            elif [ "$STATE" = MERGED ] && [ "$HEAD_OID" = "$PUSHED" ]; then
              echo "landed=merged" >> "$GITHUB_OUTPUT"
              echo "#$NUM ($BRANCH) merged with this run's data in it." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$STATE" = OPEN ]; then
              echo "arm_error=$ARM_SAID" >> "$GITHUB_OUTPUT"
              echo "::warning::#$NUM is open but auto-merge is not armed on it. $ARM_SAID"
              stuck arm_refused "#$NUM holds today's data and is open, but GitHub would not arm auto-merge on it."
            else
              stuck not_open "Today's data is on $BRANCH, but #$NUM is $STATE without this run's commit, so there was no open pull request to arm."
            fi
          fi

      # Last, so the community data above is committed first. A rejected
      # stats refresh fails the run here, with the failing tests already
      # printed as ::error:: annotations by the gate step.
      - name: Fail the run if the stats refresh was rejected
        if: ${{ !cancelled() && steps.stats_gate.outputs.rejected == 'true' }}
        run: |
          echo "::error::The wiki stats refresh was rejected by the test gate; the old stats are still live. See the 'Test gate' step."
          exit 1

      # Same contract for a new god or item the gate left out: the rest of the
      # day's data is committed above, the run goes red here.
      - name: Fail the run if a new god or item was left out
        if: ${{ !cancelled() && steps.new_entities.outputs.rejected == 'true' }}
        run: |
          echo "::error::A new god or item was left out by the gate; see the 'Add new gods and items' step and data/_new_entities.json."
          exit 1

      # Same contract for the per-aspect feed: the store is untouched, the rest
      # of the day's data is committed above, and the run goes red here.
      - name: Fail the run if the aspect feed was refused
        if: ${{ !cancelled() && steps.aspect_feed.outputs.rejected == 'true' }}
        run: |
          echo "::error::The per-aspect match feed was refused and the aspect match store is unchanged; see the 'Pull per-aspect match records' step. The next run walks back over the missed day."
          exit 1

      # THE RUN IS RED WHENEVER THE DAY'S DATA DID NOT REACH MAIN, and that is
      # the point. The direct push this replaced failed loudly and was still
      # missed for three days; a green run with a warning attached would be
      # easier to miss, not harder. So the data being stuck is a failure, with
      # its cause named, and the PR number is in the job summary so the day's
      # work is one click away rather than lost.
      #
      # IT SAYS ONLY THE CAUSE IT WAS GIVEN. It used to infer one from which
      # token was used, so any failure with the PAT present read "auto-merge
      # is likely off", including a PR that had simply stopped being open.
      # A cause it does not recognise is reported as unrecognised, not guessed.
      #
      # This step does nothing on a day when nothing moved, nor when the data
      # is armed or already merged: only a stuck PR sets `landed=stuck`.
      - name: Fail the run if today's data is stuck in a PR
        if: ${{ !cancelled() && steps.data_pr.outputs.landed == 'stuck' }}
        # Through `env` rather than interpolated into the script: a step
        # output is data, `arm_error` is text gh printed, and data does not
        # belong in the middle of a shell command.
        env:
          STUCK: ${{ steps.data_pr.outputs.stuck }}
          NUM: ${{ steps.data_pr.outputs.number }}
          BRANCH: ${{ steps.data_pr.outputs.branch }}
          PR_STATE: ${{ steps.data_pr.outputs.pr_state }}
          ARM_ERROR: ${{ steps.data_pr.outputs.arm_error }}
        run: |
          case "$STUCK" in
            no_pat)
              echo "::error::Today's data is in #$NUM with NO checks, so nobody can merge it. The REFRESH_PAT secret is not set. Create a fine-grained PAT scoped to this repository with Contents and Pull requests at read/write, store it as REFRESH_PAT, and this workflow will use it for both the push and gh. GITHUB_TOKEN cannot trigger the required checks, which is why the fallback cannot land data." ;;
            arm_refused)
              echo "::error::Today's data is in #$NUM, which is open, but auto-merge could not be armed on it. $ARM_ERROR. REFRESH_PAT is set, so the refusal is about the repository or the PR: 'Allow auto-merge' is off in the repository settings, or #$NUM is not in a mergeable state (a conflict with main, for one); gh's words above say which. Fix that, then merge #$NUM by hand once its checks pass." ;;
            not_open)
              echo "::error::Today's data was pushed to $BRANCH, but #$NUM is $PR_STATE without this run's commit, so there was no open pull request to arm. This is not an auto-merge problem. Open a pull request from $BRANCH into main by hand, or re-run this workflow: with no open pull request for today it opens a new one." ;;
            *)
              echo "::error::Today's data did not reach main, for a cause this step was not told (stuck='$STUCK'). See the log and the job summary of 'Open a pull request if anything moved'." ;;
          esac
          exit 1
