# Expert judgements on the recommender's output.
#
# WHY THIS FILE EXISTS. Everything else in this project validates against
# community build data, and docs/STATE.md §1 shows that data cannot adjudicate
# the model's central claims: both of the headline gate's targets are also model
# inputs, so the objective is maximised by deleting the model. §5 names the
# absence of a second, non-circular gate as the highest-value thing left, and
# says the fix "is not a modelling task".
#
# This is that second gate, in its cheapest possible form: a strong player looks
# at a build and says what is wrong with it, and the claim is written down in a
# shape a script can check. It is not a large sample and it is not blind. It is
# the only signal here that is not made of the community's own build.
#
# HOW TO USE IT. `python -m smite.expert_review` replays every claim against the
# CURRENT index and reports which still hold. A claim that has stopped holding
# is not automatically a win — read what it says. `item-overweighted` resolving
# because the item left the build is a win; it resolving because the whole build
# changed underneath is a coincidence.
#
# SCHEMA. Each entry:
#   reviewer     free text; who said it, at what level of play
#   date         ISO date the judgement was made
#   god / mode   what it is about; omit both for a claim about the whole model
#   claim        one of the checkable kinds below, or `narrative` for prose
#   detail       the specifics the checker reads
#   quote        their own words, verbatim, so a paraphrase can't drift
#   status       open | resolved | rejected — set by a human, never by a script
#   last_verdict what the checker said when a human last looked. `--check` fails
#                when a `resolved` claim scores WORSE than this, so a fix coming
#                undone one step at a time is caught. Added 2026-08-19, after
#                the effect-tag pass took Ullr from `clear` to `partial` and the
#                gate stayed green: it only tested for a claim reverting all the
#                way to `holds`. Omit it and that older, weaker rule applies.
#
#                IT IS A BASELINE, NOT A TARGET. Lowering it to match a build
#                you just broke turns this gate into a rubber stamp. Raise it
#                when a fix lands; change it downward only as a recorded
#                decision, in `notes`, with what was traded for what.
#
# CLAIM KINDS the checker understands:
#   missing-item      detail.items should appear in this god's core and do not
#   item-overweighted detail.items should NOT appear in this god's core
#   narrative         prose only; recorded, never auto-checked

reviews:
  - reviewer: "Masters-level SMITE 2 player (friend of the maintainer)"
    date: 2026-08-09
    god: Ullr
    mode: Conquest
    claim: missing-item
    detail:
      items: [Transcendence, Heartseeker, "Hydra's Lament", "Jotunn's Revenge"]
    quote: >-
      Ullr's build is almost always Transcendence, Heartseeker, Hydras,
      Jotunn's, etc.
    status: resolved
    last_verdict: clear
    notes: >-
      Partly addressed. At the time of the review the model's core was
      Lernaean Bow / Berserker's Shield / Jotunn's / Riptalon / Damaru /
      The Crusher, overlapping the community build on 2 of 6. Fixing the
      stance-god ability scrape (wiki_parser._section_tables) gave Ullr a
      measured kit for the first time — he reported n_scaling_abilities 0 —
      and the core now also holds Heartseeker and Titan's Bane. Transcendence
      is still ranked 25th of 40: it is a STACKING item whose listed stats are
      deliberately below curve, which the gold model reads as poor value.
      Diagnosed and reproducible: `price_stacks` in _weights.yaml prices a
      persistent stack at its full-stack value and moves Transcendence to rank
      6/95, residual +208 -> -222. It ships OFF because the coverage gate says
      33.1% -> 28.8%. This claim is therefore open BY DECISION rather than for
      want of a fix, and it is the sharpest case on record of the expert gate
      and the coverage gate disagreeing about one named item.

      UPDATE 2026-08-14. Root-caused and partly answered. Transcendence's
      value is a CONVERSION - "+Strength equal to 3% of Mana from Items" - so
      it is worth what the rest of the build feeds it, and the fit map priced
      Max Mana at zero. `price_conversions` now prices that against a typical
      build, which lifts its residual +216 -> -8 but leaves it conservative on
      purpose: at a median physical build it is a +43% item, and only at
      Ullr's actual 1,550-mana build is it +133%. The `mana-stack` flavor is
      the other half, and it reproduces the reviewer's build at 5 of 6 -
      Transcendence, Jotunn's, Hydra's, Heartseeker, Titan's Bane. The CORE
      still does not hold it, so this claim stays open: the register checks
      the build the app opens on, not whichever of twelve flavors contains the
      item.

      TWO-PASS ASSEMBLY WOULD CLEAR THIS, AND IS SHIPPED OFF. Re-pricing the
      converter against the core the previous pass produced puts Transcendence
      in Ullr's core at 5 of 6, converging in two passes with no oscillation
      for him, and takes Transcendence to 12 model cores against 11 community
      builds. It ships off because no pass count beats one pass on BOTH
      leakage-free splits (probe 37.6% -> 36.2%, best 34.1% -> 34.3%) and 3 of
      87 gods oscillate between two cores. `conversion_passes` in
      _weights.yaml is one value away. So this claim is now open for the SAME
      reason twice over: two independent fixes each do what the reviewer asked
      on the item they named, and the only gate available refuses both.

      RESOLVED 2026-08-14, BY DECISION RATHER THAN BY MEASUREMENT. The
      maintainer turned `conversion_passes` to 3. Ullr's core now holds
      Transcendence, Heartseeker, Hydra's Lament and Jotunn's Revenge - all
      four items named, 5 of 6 against his community build - and the checker
      reads `clear` on its own terms rather than through a flavor.

      What has NOT changed is the evidence. The gate still prefers one pass on
      the probe corner; this claim closed because a human weighed the
      item-level calibration and an expert's judgement above a coverage figure
      that STATE.md section 1 says cannot adjudicate it. That is a defensible
      call and it is not a measurement. If a non-circular gate ever exists,
      this is among the first things it should be pointed at.

  - reviewer: "Masters-level SMITE 2 player (friend of the maintainer)"
    date: 2026-08-09
    claim: item-overweighted
    detail:
      items: [Eye of Providence]
      scope: support-solo
    quote: >-
      Eye of Providence seems to be overvalued because it's assuming you'll get
      the gold from it.
    status: resolved
    last_verdict: partial
    notes: >-
      Confirmed and fixed. Cost 2300 against a fitted stat price of 2550, so it
      read as a 250g bargain — the discount is really the ward economy's price
      tag. Across the 34 Support/Solo Conquest gods the model put it in 16
      cores; those gods' own players buy it, in any slot or as any alternate,
      on exactly one. Tagged `ward-economy` with a -0.15 conquest tag_bonus;
      16 cores -> 4, and the leakage-free gate moved 29.3% -> 30.0%.

      RAISED partial -> clear 2026-08-29, ON A REFRESH AND NOT ON A FIX. The
      checker now reads `absent from all 36 Conquest cores in scope`. It read
      `still in 1/36 cores: ['Geb']` at 811fb46, the last commit before five
      `chore(data): daily community refresh` landed, and nothing but data
      changed across that window — no weights, no model code, no hand edit to
      this file. The scope has been 36 gods on both sides; the "34" above is
      the 2026-08-09 roster and is left as written.

      IT IS THE GOOD KIND OF CLEAR, checked the way this file's header asks.
      Geb's core kept 5 of its 6 slots. The one that moved was Eye of
      Providence out and Genji's Guard in, so the claim did not clear because
      the build churned underneath it — and the item that replaced it is the
      community's own second slot for Geb, at pick 0.26.

      THE MECHANISM IS THE UNKNOWN-WIN CONSTANT CROSSING A MEASURED RATE, and
      it is worth reading as evidence for STATE.md section 5. Pre-refresh, Eye
      of Providence held that slot on efficiency 0.61 with pick 0.00 and win
      0.55 — and 0.55 was not a measurement of anything. It is Geb's own
      median measured win rate standing in for "no record"
      (`scoring.god_unknown_win_rate`). Genji's Guard, an item with a real
      record, measured 0.50 at that slot: BELOW the placeholder the unmeasured
      item was handed for free. The refresh moved Geb's median to 0.61 and
      Genji's measured rate to 0.64, the order flipped, and the item carrying
      evidence took the slot. That is the reviewer's objection resolving on
      exactly its own terms — "it's assuming you'll get the gold from it" —
      because the item was in the core on gold-efficiency and no evidence, and
      it left the moment something with evidence outranked it.

      IT IS ALSO A THRESHOLD CROSSING AND CAN COME BACK. Geb's median and
      Genji's measured rate are 0.03 apart and both move on every refresh. If
      a later refresh puts Eye of Providence back, `--check` going red is this
      gate doing its job; diagnose it, and do not lower this line to match —
      see the header.

      LOWERED clear -> partial 2026-09-01, AT ea3b5e7, ON THE SAME MECHANISM
      RUNNING THE OTHER WAY, ON A DIFFERENT GOD. The checker now reads `still
      in 1/36 cores: ['Ymir']`. Geb is unaffected and clean — his Conquest
      core is still `Genji's Guard, Kinetic Cuirass, Freya's Tears, Shifter's
      Shield, Amanita Charm, Erosion`, no Eye of Providence — so this is not
      the 08-29 crossing un-happening, it is a fresh instance of the same
      threshold on a different god. Three more `chore(data): daily community
      refresh` commits landed between 08-29 and today; nothing else changed.

      DIAGNOSED THE SAME WAY, TO THE NUMBER. Scoring Ymir's Conquest slot
      directly (`scoring.score_god_items`, current data, current
      `_weights.yaml`, with `efficiency.apply_pricing_flags` applied the way
      `recommend.main --all` does — skip that step and the reproduction
      silently scores a different, unshipped model): Eye of Providence has no
      community record for Ymir at all (`lookup_rates` returns pick 0.00, win
      `None`), so it is handed `scoring.god_unknown_win_rate` — Ymir's own
      median measured win rate, **0.59** — as its win term. Genji's Guard has
      a real record: pick 0.20, win **0.55**. Full line: Eye of Providence
      efficiency 0.614 / win 0.59 / pick 0.00 / fit 0.470 -> total 0.5509;
      Genji's Guard efficiency 0.656 / win 0.55 / pick 0.20 / fit 0.386 ->
      total 0.5453. The core swings on a margin of 0.0057 total, and the win
      term alone is worth `0.45 * (0.59 - 0.55)` = **0.018** of it — three
      times the whole gap, in the unmeasured item's favour, from a number that
      is not a measurement of Eye of Providence at all. Recomputed with the
      global constant (`unknown_win_per_god` off, flat 0.5) instead of Ymir's
      median, Eye of Providence's total drops to 0.5104 — well below Genji's
      Guard — and it loses the slot. Efficiency and fit alone do not explain
      this swap; the placeholder crossing a real measured rate does, on both
      gods it has now been checked on.

      NOT A NEW FAILURE MODE — THE ONE THIS ENTRY ALREADY NAMED, FIRING AGAIN.
      08-29's note called this "a threshold crossing 0.03 wide and can come
      back" and said going red is the gate doing its job. Ymir's gap is 0.04
      wide (0.59 vs 0.55), same shape, different god, and the baseline below
      is set to what the checker says today rather than restamped silently.

      RECOMMENDATION, NOT A CHANGE — this is model work and a separate
      session's decision, not this one's. Three candidates, ranked by how
      much they cost against the discipline docs/STATE.md section 1 and
      section 4.16/4.19 already paid for:

        1. Cap the placeholder at the god's WORST measured rate rather than
           the median, so an unmeasured item can never outrank every item
           carrying evidence. This changes what the number answers — not
           "what should nothing sit at" but "what floor must nothing clear" —
           and the choice of floor (worst item vs. some percentile) is exactly
           the kind of invented constant section 4.16 refused to write without
           a non-circular way to size it. No such measure exists here either.
        2. Turn `unknown_win_per_god` off globally (flat 0.5). Already
           measured, in `scoring.god_unknown_win_rate`'s own docstring, as
           moving only the circular gate (coverage 53.3% -> 38.3%, rank
           correlation unchanged at 0.569) — and it would touch every god's
           core, not just the two this claim has caught, with nothing
           non-circular to weigh the trade against.
        3. Do not touch the placeholder; extend the one non-circular
           instrument that exists — `build_quality`/`combat.py`, which has
           never seen a community build — to give an actual verdict on
           whether a ward-economy item is overvalued for a given Support/Solo
           core, so this claim stops being adjudicated by a coin-flip between
           two win-rate numbers neither of which was designed to answer it.
           This is the STATE.md section 5 gap the 08-29 note already pointed
           at, not new work invented for this entry.

      None of the three is implemented here. Core churn this session is 0.

  - reviewer: "Masters-level SMITE 2 player (friend of the maintainer)"
    date: 2026-08-09
    claim: narrative
    detail:
      topic: build-coherence
    quote: >-
      It doesn't seem to consider the build as a whole and it's just
      recommending the statistically best items. So when looking at the
      community data it needs to consider item pairing over raw pick
      percentage.
    status: open
    notes: >-
      Real, and the sharpest single observation in the review. `assemble_core`
      takes six independent arg-maxes, and for Ullr the items ranked 3rd
      through 10th of 40 span 0.027 — the cut at six is close to arbitrary.
      A set-level coherence term was built and measured against the
      leakage-free gate and made it monotonically worse (32.1% -> 16.6% at full
      strength); it ships off, with the numbers under `coherence` in
      _weights.yaml. True item PAIRING is not derivable from the current
      source at all: smitebrain gives per-slot marginals plus two alternates,
      never a joint distribution. That needs match-level data.

  - reviewer: "Masters-level SMITE 2 player (friend of the maintainer)"
    date: 2026-08-09
    claim: narrative
    detail:
      topic: incomplete-builds
    quote: >-
      It also needs to factor in incomplete builds (for short matches or
      forfeits, it shouldn't count those empty item slots as "games where
      people didn't buy it" for items that are typically bought later).
    status: resolved
    notes: >-
      Confirmed and fixed. Summing each slot's top pick and its two scraped
