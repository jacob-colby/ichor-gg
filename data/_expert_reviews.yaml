      RE-EXAMINED 2026-09-03 AGAINST THE FOUR NEW CLAIM KINDS; STAYS
      NARRATIVE. This is a claim about how a DENOMINATOR is read, not about
      any build, and its checkable consequence is an invariant on scoring
      rather than a property of a core. That invariant is guarded where it
      belongs — `test_scoring` pins `SLOT_REACH` conditioning — so a replay
      gate keyed on builds has nothing to add. What it would need to become
      checkable here: per-game outcome data that separates "not bought" from
      "the game ended first", which is the same match-level source every
      refused shape needs.
