# DRAFT — god passive classes (2026-11-03). NOT REVIEWED, NOT READ BY ANY CODE.
#
# A regex classification of each god's Passive-slot text, the way
# _passive_classes.yaml classifies items, for a diagnosis: how much value do
# god passives carry that Ichor ignores? Classes, primary first (the class
# whose cue appears EARLIEST in the text); `conditional` is a modifier, listed
# last, never primary unless it is the only cue:
#   stat_grant  combat_effect  sustain  ally  utility_cc  summon  conditional
# `scaling_line`: the passive carries a Damage/Heal Scaling line, which is the
# only part kit.py reads (stat orientation). `kit_fit_ally_support`: kit_fit
# already reads this god's ability text as helping an ally.
#
# Known misreads to fix in review: the cues are lexical, so "Health" stat
# grants and heals were split by hand-tuned patterns; Mordred and Hua Mulan's
# passives are mostly kit-mechanics (Wrath, weapon Skill) and read as
# conditional/utility. Treat every row as a proposal.
Achilles:
  passive: Gift of the Gods
  classes:
  - stat_grant
  - utility_cc
  - conditional
  scaling_line: false
  kit_fit_ally_support: false
