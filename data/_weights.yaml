# Tuning surface for the build recommender. Edit and re-run
# `python -m smite.recommend --all`. Anything omitted falls back to the
# built-in defaults in tools/smite/scoring.py.
signals:
  # Set 2026-07-23, re-examined 2026-08-05 and DELIBERATELY LEFT ALONE.
  #
  # The 2026-08-05 sweep proposed 0.35/0.40/0.10/0.15 (objective 0.655 against
  # this point's 0.643). It was rejected, because the sweep cannot select
  # weights: both of the validation metric's targets are also model inputs.
  # `win` IS the Spearman target, so weighting it 1.0 scores a perfect 1.000;
  # `pick` all but determines community membership, so weighting it 1.0 covers
  # 98.1%. Both degenerate corners beat every honest blend, the proposed
  # winner differs from this point only by moving 0.05 toward `pick`, and it
  # sits pressed against the pick <= 0.15 guardrail — the constraint speaking,
  # not the data. See the leakage probe in Analysis/_calibration.md.
  #
  # What IS measurable, with win and pick zeroed so no target enters the score:
  # against a random 6-item core at 6.5% coverage, efficiency alone reaches
  # 13.3%, fit alone 26.9%, and the two together 27.8% — the model finds
  # community-worthy items ~4.3x better than chance. Every split from 0.15 to
  # 0.65 efficiency lands inside one flat plateau (overlapping bootstrap CIs),
  # so there is no evidence for moving this ratio; what the sweep separates
  # clearly is that efficiency-DOMINANT blends collapse (13.3% at 1.00).
  #
  # The matching negative, recorded so it is not rediscovered as a surprise:
  # within the community's own item set the model does not rank at all (mean
  # within-god rank correlation -0.05, positive on 38 of 85 gods). It is a
  # working filter and not a working ranker. The 51% headline conflates both.
  efficiency: 0.35   # gold-value residual (hard math)
  win: 0.45          # SmiteBrain high-elo win rate (performance)
  pick: 0.05         # SmiteBrain pick rate (popularity)
  fit: 0.15          # archetype + kit god-fit
hybrid:
  # The hybrid build is the model's core, corrected only where the model is
  # near-indifferent AND the community's evidence is strong. Loosening either
  # of the first two collapses it toward the community build, which already
  # exists on its own; max_swaps is the backstop that keeps it a correction
  # rather than a replacement.
  # The model's top picks are never overridden. Below that line it has no real
  # preference — measured across 87 gods, its own 6th-vs-7th quality gap has a
  # median of 0.000 and a negative mean, because the assembler's boots and
  # lifesteal caps skip higher-quality items. Those slots are near-arbitrary,
  # and are exactly where real evidence should win.
  protected: 3         # untouchable model convictions (of a 6-item core)
  # The bar is the god's OWN win rate, not a constant: an item winning 56% on a
  # 52% god is evidence; the same 56% on a 60% god is below par. min_edge is how
  # far above that baseline the Wilson LOWER BOUND must sit — 0 means "beat the
  # god's own average, with confidence".
  min_edge: 0.0
  max_swaps: 3         # at most half the core may be overridden
underrated:
  # Flag items that are intrinsically good for the god (efficiency + fit) yet
  # rarely picked. Quality is judged relative to the god's own item pool.
  top_quality_frac: 0.30   # consider only the top 30% by quality...
  max_pick: 0.15           # ...and flag those whose pick rate is at most this
# ── Damage-derived fit (B4) — measured, and shipped OFF ────────────────────
# Both were expected to be precision wins and both made the validation gate
# worse, so they default off. Numbers in pipeline/smite/damage_value.py.
#   magnitude_fit      item stat MAGNITUDE counts, not just presence.
#                      48.4% -> 44.9% coverage. Probably double-counts what
#                      the gold model already prices.
#   damage_fit_blend   offensive stat weights from the god's own scaling
#                      coefficients instead of the role table. Neutral to 0.2,
#                      then falls away: 0.3 -> 47.3%, 0.5 -> 47.1%.
#
# THOSE FIGURES ARE THE CIRCULAR GATE AND THEY POINT THE WRONG WAY.
# `damage_fit_blend` had never been swept against the leakage-free splits.
# Done 2026-08-21, fixture loaded once so the data cannot move under the sweep,
# with a PAIRED bootstrap on the per-god delta as well as the marginal CI
# `model_signal_sweep` uses:
#
#   blend  probe 0.70:0.30          paired 95% CI     best 0.45:0.55   cores
#    0.00     38.7%  (control)                 --        39.6%   (ctl)     --
#    0.05     38.9%                [-0.67%, +1.12%]      39.8%          3/89
#    0.10     39.3%                [-0.67%, +1.99%]      39.8%          4/89
#    0.20     39.6%                [-0.45%, +2.25%]      39.8%          8/89
#    0.30     39.6%                [-0.45%, +2.25%]      39.8%          8/89
#    0.50     39.3%                [-0.71%, +2.13%]      40.0%         13/89
#    0.75     39.8%                [-0.22%, +2.58%]      40.0%         20/89
#    1.00     38.9%                [-1.57%, +1.84%]      39.4%         37/89
#
# So on the honest measure it is mildly POSITIVE at every setting below 1.0,
# not negative — and NOT ONE paired CI excludes zero, on either split. It is
# also a real knob, unlike `adaptive_fit`: core churn rises 3 -> 37 of 89
# monotonically, so this sweep could have varied and did.
#
# THAT SWEEP MEASURED TWO THINGS AT ONCE AND THE ANSWER IS THE OTHER ONE.
# Decomposed 2026-08-21 by blending one group of stats at a time, at 0.75:
#
#   arm                          probe 0.70:0.30      paired 95% CI    cores
#   control                            38.7%                     --       --
#   all three stats (the row above)    39.8%       [-0.22%, +2.58%]    37/89
#   Strength + Intelligence only       38.6%       [-1.80%, +1.57%]    29/89
#   Attack Damage only                 40.4%       [+0.19%, +3.22%]    30/89
#
# The Attack-Damage column is the entire gain and the Strength/Intelligence
# remainder is a null that DILUTES it — with both halves on, coverage is 40.0%
# against 40.6% for the Attack-Damage half alone. So it is carved out into
# `attack_damage_fit` below, which ships ON; `blend_stat_values` no longer
# touches Attack Damage at all, and this key is now the remainder.
#
# THE REMAINDER, RE-SWEPT AS ITSELF. Not the sweep above — that one included
# the column that has since left:
#
#   blend  probe 0.70:0.30   best 0.45:0.55   cores    better/worse
#    0.00      38.7% (ctl)      39.6% (ctl)      --             --
#    0.10      39.1%            39.8%         14/89          4 / 2
#    0.30      39.6%            39.8%         20/89          7 / 3
#    0.50      39.1%            39.8%         26/89          7 / 5
#    0.75      38.6%            39.8%         29/89          7 / 7
#    1.00      37.7%            39.6%         38/89         7 / 11
#
# On the probe split it peaks at 0.30 and then falls BELOW control, ending
# −1.0pp and worse on 11 gods against better on 7. On the best split it is
# pinned at +0.2pp from 0.10 to 0.90 while moving at most two gods' coverage.
# Two splits that disagree about the direction, and a harmful tail — that is
# the shape of `conversion_fit` (register 4.9), and it ships off for the same
# reason. Its own normalisation is also wrong; see `blend_stat_values`.
# Turn either on only with a `calibrate` run to back it up.
magnitude_fit: false
damage_fit_blend: 0.0

# ── The Attack Damage column (the carve-out) — measured, and shipped ON ────
# `role_stats` never names Attack Damage and neither does `kit_stat_overlay`,
# so the merged role+kit fit map scores it at exactly 0.0 on 89 OF 89 GODS —
# while `damage_value.stat_weights` measures it NON-ZERO on all 78 gods whose
# kit parses. This is not a weight that was set too low. It is an absent
# column, and it is the fit-side twin of the hole closed on the damage side
# the day before (STATE.md §3, "the damage model counts the basic attack"):
# the same stat was missing from both halves of the model, because everything
# we scrape describes basic attacks somewhere other than where we were reading.
#
#   str   probe 0.70:0.30      paired 95% CI    best 0.45:0.55   cores  b/w
#   0.00        38.7% (ctl)               --       39.6% (ctl)      --   --
#   0.10        38.9%       [-0.67%, +1.12%]       39.6%         12/89  3/2
#   0.30        38.9%       [-0.90%, +1.35%]       39.8%         17/89  4/3
#   0.50        39.1%       [-0.67%, +1.80%]       40.0%         23/89  5/3
#   0.65        40.2%       [-0.00%, +3.03%]       40.0%         30/89 10/3
#   0.75        40.4%       [+0.19%, +3.22%]       40.7%         30/89 11/3
#   0.90        40.2%       [-0.11%, +3.18%]       40.7%         33/89 11/4
#   1.00        40.6%       [+0.34%, +3.52%]       40.5%         33/89 12/3  <-
#
# Positive on BOTH leakage-free splits at every strength, which is the bar
# `price_adaptive` was held to — and unlike that flag, and unlike everything
# else in register entry 4, THE PAIRED CI EXCLUDES ZERO (at 0.75 and at 1.00,
# on the probe split). It is still 89 gods and the best split's CI does not;
# do not quote +1.9pp as significant.
#
# WHY 1.0 AND NOT AN ARGMAX. The value being blended against is zero, so the
# strength is a pure scale: (1-s)*0 + s*w*ref. There is no prior here to trade
# off against the measurement, and 1.0 is "the measurement, on the fit map's
# own scale". It is NOT the maximum — past it the metric is flat and noisy
# (1.25 -> 39.9% / 40.9%, 1.50 -> 40.5% / 40.7%, 2.00 -> 40.0% / 40.9% with
# 47 cores moved) and the CI stops excluding zero. Picking the argmax off that
# plateau would be tuning against the gate; see docs/STATE.md §1.
#
# THE ITEMS IT MOVES ARE NAMEABLE, which is the point. At 1.0 on the best
# split, 31 departures of which 11 appear in that god's own community record
# against 31 arrivals of which 14 do. The arrivals are Attack Damage items the
# fit map could not previously score at all: Tyrfing (25 Attack Damage) enters
# 8 cores, and it is that god's SLOT-1 community item for Izanami (72% pick),
# Medusa (44%) and Kali (39%); Riptalon enters Medusa, Izanami, Ishtar, Jing
# Wei and Xbalanque, all of them with a community sighting. Medusa is the
# worked case register entry 4.12 wrote down and she goes 0.000 -> 0.400.
#
# AND ITS LOSSES ARE NAMEABLE TOO. Five gods get worse: Princess Bari
# 0.333 -> 0.000 (a Mid-flavoured Carry, basic-attack share 0.13, rebuilt as a
# basic-attack god), Hua Mulan and Jormungandr each lose a slot-1 protection
# item (Shifter's Shield, 54% and 46% pick) because Attack Damage now competes
# with protections on a bruiser, Ullr loses Heartseeker (58% pick) and Pele
# loses The Reaper (36%). The net is +12/-3 gods on the probe split and
# +8/-5 on the best one. A fit column cannot be given to the Carries alone
# without a per-god casting/swinging time-share, which is the same thing
# register 4.12 could not source for `damage_per_second`.
#
# THE BLAST RADIUS IS WIDEST WHERE THE EVIDENCE IS THINNEST, and that is worth
# knowing before the next change to it. Regenerating every build note moves 23
# of 90 Conquest cores (23 swaps) but 42 of 90 JOUST cores (49) and 38 of 89
# ARENA ones (53), because those two modes zero `win` and `pick` — so the fit
# map is the whole score there and nothing damps a change to it. Everything
# above was measured on Conquest community data; Joust and Arena have no
# record of their own and BORROW Conquest's (see `borrow_community`), so the
# larger half of this churn is unmeasured by construction.
attack_damage_fit: 1.0
# ── The clock (B5) ────────────────────────────────────────────────────────
# What `damage_value.item_damage_gain` RETURNS. False = one ability rotation
# plus one basic attack, where the 1:1 mix is a declaration and nothing else.
# True = damage per SECOND, each channel on its own scraped clock: abilities
# x `casts_per_second` off the ability's cooldown, basics x `attacks_per_second`
# off the god's base attack speed. It is the only setting under which Attack
# Speed (34 items) and Cooldown Rate (34 items) buy any modelled damage
# anywhere in this repo.
#
# It reaches `build_index._god_item_damage` -> the draft's B6 overlay and
# nothing else, so `calibrate` cannot see it either way. The leakage-free
# measure for this table is where the community's own Conquest items land in
# the damage ordering, 0 = top; the table takes no community input at all, so
# that number is not the circular one of STATE.md section 1.
#
# CRITERION, SET BEFORE THE MEASUREMENT AND NOT MOVED. Ships ON only if (1)
# the Carry figure improves, (2) the roster-wide figure does not get worse,
# and (3) `calibrate --control` is unchanged, since this path must stay
# invisible to the gate. MEASURED 2026-08-21, mean normalised rank of the
# community's own Conquest items in the damage ordering, 0 = top:
#
#                    false    true
#     Carry   n=108  0.439   0.351   <- criterion 1 PASSES, and by a lot
#     Jungle  n=102  0.264   0.296
#     Mid     n=135  0.286   0.473   <- and this is why it does not ship
#     Solo    n=108  0.720   0.723
#     Support n= 78  0.702   0.714
#     ALL     n=531  0.462   0.500   <- criterion 2 FAILS
#     unscored  262 -> 168 of 531, so the pool it ranks against got BIGGER,
#     which biases this metric in its favour. It loses anyway.
#
# Criterion 3 holds: control 38.7% / 39.6% either way, byte-identical.
# The same ordering falls out of a second metric that normalises against items
# SCORED rather than the fixed buildable pool (Carry 0.650 -> 0.469, ALL
# 0.635 -> 0.644), so the conclusion does not rest on the denominator.
#
# Medusa, the case this was built for, is a clean win: Tyrfing 56 -> 5,
# Silverbranch Bow 71 -> 22, Riptalon 72 -> 38, and Odysseus' Bow and The
# Executioner get a damage figure at all for the first time. Scylla is the
# clean loss: Avatar's Parashu, a Strength item, becomes her top damage item,
# which is arithmetically CORRECT — SMITE 2 basic attacks scale 100% Strength
# for everyone — and is wrong about Scylla, who does not auto-attack.
#
# Its known bias is in `item_damage_gain`'s docstring with the numbers: full
# uptime on both channels at once, which puts a median 61% of a Mid's marginal
# power in their basic attack. Disclosed, not patched — the correction needs a
# cast-time source this repo does not have.
damage_per_second: false
# Fit credit for a stat the god's pool can CONVERT into one they want, scaled
# by what the god thinks of the target stat (see scoring.converter_stat_weights).
# In practice this is Max Mana: Transcendence -> Strength, Book of Thoth ->
# Intelligence. `price_conversions` fixed the efficiency half of this and left
# fit reading 0.17 on Transcendence for Ullr.
#
# MEASURED, AND SHIPPED OFF. It does exactly what it was built to do — Ullr's
# Transcendence goes fit 0.172 -> 0.238 and rank 48/95 -> 36/95 in Joust — and
# no setting beats control on both leakage-free splits:
#
#            probe 0.70:0.30      best 0.45:0.55
#   0.00        37.5%  (control)    35.2%  (control)
#   0.05        37.0                35.0
#   0.10        36.8                34.3
#   0.20        37.9                32.2
#   0.25        39.1                32.9
#   0.30        37.9                33.4
#   0.50        36.7                34.1
#   0.75        35.2                36.4
#   1.00        32.1                35.1
#
# The two splits move in opposite directions, which is the signature of a term
# trading against the fit weight rather than adding information. Note also that
# 36th of 95 is nowhere near a core slot: even shipped ON this would not put
# Transcendence in Ullr's Joust build. The `mana-stack` flavor is the supported
# way to ask for that build, and it already weights Max Mana at 0.5.
conversion_fit: 0.0
# Unconditional passive grants counted as stats — measured, and shipped OFF.
# 51.0% -> 50.4% coverage. It prices items visibly more sensibly (every
# Adaptive Stat item stops reading "premium") and ranks them worse. See
# pipeline/smite/passives.py for the numbers and the likeliest reason.
price_passives: false
# The FIT half of the same problem — measured 2026-08-19, and shipped OFF for a
# more interesting reason than its twin above.
#
# Eight buildable items read `Adaptive Stat: +X Strength or +Y Intelligence` and
# carry that power nowhere in `stats`. Four have a one-entry stats dict, so
# `god_fit_score` scores Omen Drum — 2800 gold — off `{Echo: 30}` and returns
# 0.0000 for Ullr. `price_passives` (above) is the efficiency half and was
# already measured; the fit half had never been tried and is not in STATE.md 4.
#
#   variant                 eff 0.70:fit 0.30   eff 0.45:fit 0.55
#   control, both off             35.5%               36.7%
#   fit half only                 35.5%               36.7%   <- exact no-op
#   efficiency half only          34.1%               36.6%
#   both halves                   34.1%               36.6%   <- fit adds 0.0
#
# IT IS NOT INERT BECAUSE IT DOES NOTHING. The mechanism fires and fixes what
# it claims to: Omen Drum's fit for Ullr goes 0.0000 -> 0.1720. It moves him
# from rank 90 to rank 88 of ~90, which is not a core slot and never becomes
# one. Swept 0.15 to 1.0, every strength gives the identical figures above.
#
# So the blindness is real, the correction is right, and it cannot matter,
# because these items are ALSO bottom-ranked on efficiency and the half that
# would move them is the half that reproduces 4.5's damage — -1.4pp on the
# probe split, alone or paired. Fixing one half of a two-half problem buys
# exactly nothing, and this is the measurement that says so.
#
# RE-MEASURED 2026-08-20, because the first sweep could not have varied. The
# strength was applied by injecting the grant into `stats`, and with
# `magnitude_fit` off `share` is 1.0 whatever the value — so every setting ran
# the same code path and the sweep measured one behaviour five times. The scale
# now applies to the stat's WEIGHT, and Omen Drum's fit for Ullr moves with it
# (0.15 -> 0.0258, 0.5 -> 0.086, 1.0 -> 0.1720). Coverage, honestly swept:
#
#     adaptive_fit   probe 0.70:0.30   best 0.45:0.55
#     0.00 (control)      35.5%             36.7%
#     0.15                35.5%             36.7%
#     0.30                35.5%             36.7%
#     0.50                35.5%             36.7%
#     0.75                35.5%             36.7%
#     1.00                35.5%             36.7%
#
# Identical at every strength — the conclusion was right, its evidence was not.
adaptive_fit: 0.0
# The EFFICIENCY half of the same problem, carved out of `price_passives` the
# way `price_crit_multipliers` and `price_conversions` were - measured
# 2026-08-21, and the third pricing experiment here to ship ON.
#
# `price_passives` prices all 49 unconditional grants and is a ragbag; this
# prices the eight buildable Adaptive Stat items alone, and they are the least
# ambiguous members of that class. The grant is not an effect whose uptime
# someone has to judge - it is a stat, granted unconditionally, written in
# prose instead of in `stats`. All eight read `premium` with the flag off,
# four of them off a one-entry stats dict, so the model prices a 2500g item
# off a single stat and then reports a ~1000g overcharge.
#
# BOTH BRANCHES BEAT THE CONTROL ON BOTH SPLITS. Control re-measured on this
# data first, because the committed `_calibration.md` goes stale on every
# refresh; the random-core baseline is unmoved at 5.74%, which is how we know
# it had not.
#
#     variant                       probe 0.70:0.30   best 0.45:0.55
#     control, flag off                   37.7%            38.4%
#     price_adaptive, Strength            38.7%            39.6%   <- shipped
#     price_adaptive, Intelligence        38.1%            38.9%
#
# Strength is better on both, and it was also the a-priori choice; see
# `passives.adaptive_grants` for why the branch is chosen from the item text
# rather than from the fitted prices. Paired per-god bootstrap of the shipped
# arm against control: +1.01pp [-1.61, +3.78] on the probe split, better on 18
# gods and worse on 15; +1.20pp [-0.94, +3.30] on the best split, better on 15
# and worse on 9. BOTH INTERVALS CONTAIN ZERO. This clears the bar the other
# two pricing flags were held to - positive on both splits - and it is not a
# significant result at 89 gods. Do not quote +1.2pp as one.
#
# CORE CHURN, at the shipped arm against control: 83 of 89 Conquest cores
# change at the probe split (127 item swaps of 534 slots) and 58 of 89 at the
# best split (68 swaps). This is a large change for a one-percentage-point
# gain, and the reason is the next paragraph.
#
# IT IS NOT THE EIGHT ITEMS, AND THAT IS THE REAL FINDING. None of the eight
# enters a model core - not before, not after, on either split - so no part of
# the gain is those items becoming pickable. What moves is the WHOLE FIT. The
# 29 items carrying this clause were sitting in the regression with ~1000g of
# cost apiece that no column explained, and NNLS was parking it in the
# intercept:
#
#     fit                     n    intercept   Strength   Intelligence   sd(resid)
#     flag off              191         1111      18.56          12.70         468
#     priced as Strength    191          934      21.81          14.77         423
#     priced as Intelligence 191         932      22.83          14.27         423
#     items dropped from fit 174         898      22.95          14.98         427
#
# An inflated intercept under-prices every real stat for every item in the
# game, so correcting it reprices Strength +17% and Intelligence +16% pool-wide
# - which is what re-cores 83 gods.
#
# THE DIAGNOSTIC CONTROL IS IN THAT TABLE'S LAST ROW and it is the reason this
# entry does not claim more than it should. Simply DELETING the 29 items from
# the fit lands on almost the same coefficients and scores probe 39.6% / best
# 38.9% - better than pricing on the probe corner, worse on the split
# `calibrate` calls the leakage-free optimum. So most of the gain is "get the
# unexplained cost out of the intercept", and pricing is one of two ways to do
# that. Pricing is preferred on two counts: it wins on the optimum split, and
# it keeps the 29 items SCORED. Dropping them would ship 8 buildable tier-3
# items with no residual at all, which for a statless item is the true
# statement (see `efficiency.efficiency_pool`) and for these is not - they have
# stats, they have a price, and the only thing missing was that we were not
# reading their power.
price_adaptive: true

# Which side of `+X Strength or +Y Intelligence` the clause is priced as.
# `strength` or `intelligence`. Strength both measured better (above) and is
# the conservative branch on 6 of the 8 items at the fitted prices; the
# per-item gold table and the full argument are in `passives.adaptive_grants`.
# Read only when `price_adaptive` is on.
adaptive_branch: strength
# Persistent stacks at their full-stack value — measured, and shipped OFF.
# Strictly narrower than price_passives: only stacks that reach a cap and keep
# it, never a transient one. Four items qualify (Book of Thoth +500 Max Mana,
# Devourer's Gauntlet +40 Strength/+6.75% Lifesteal, Gauntlet of Thebes +700
# Max Health, Transcendence +600 Max Mana/+10 Penetration); Doom Orb,
# Necronomicon, Hastened Fatalis, The Executioner and Prophetic Cloak are all
# correctly refused for having a decay clause.
#
#     leakage-free coverage        OFF      ON
#     probe   eff 0.70 : fit 0.30  33.1%   28.8%
#     best    eff 0.45 : fit 0.55  30.5%   30.7%
#
# THE CONFLICT IS WORTH READING BEFORE TOUCHING THIS. It does exactly what a
# Masters player asked for on the one item they named: Transcendence goes from
# rank 25/95 to 6/95 for Ullr and its residual flips +208 -> -222, i.e. from
# "you are overpaying" to "this is a bargain", which is the correct reading of
# a 2400g item that ends the match with +600 mana. The coverage gate still
# says no. That is STATE.md section 1's failure mode stated as plainly as it
# ever gets: the gate rewards resembling the community's build, and this makes
# the model better at the thing the community is doing without making the
# ranking resemble it more. Off, because the discipline is that the gate wins
# absent a better measure — not because the item is priced right at +208.
price_stacks: false

# How much of a stacker's cap a real match reaches. Only read when
# `price_stacks` is on, so it is inert today.
#
# HYPOTHESIS TESTED AND REFUTED (2026-08-14). Three pricing experiments had
# shipped ON and three OFF, and the ones that shipped ON looked like they
# priced a CONSERVATIVE state (crit multipliers assume nothing about the game;
# conversions price a MEDIAN build) while price_stacks priced a MAXIMAL one
# (full 75 stacks). If that were the difference, some fraction below 1.0 should
# beat the control. Swept against both splits, control = price_stacks OFF at
# probe 37.6% / best 34.1%:
#
#     fraction   0.20   0.30   0.40   0.50   0.60   0.75   0.90   1.00
#     probe     37.0%  37.2%  37.2%  37.2%  36.3%  35.8%  34.9%  33.8%
#     best      34.0%  34.0%  34.0%  33.8%  33.8%  35.1%  35.1%  35.1%
#
# NO fraction beats the control on both. The shape is the opposite of the
# prediction: low fractions are worse everywhere, and the only gains are at
# HIGH fractions on `best` alone, which is exactly where the maximal reading
# already sat. So conservative-vs-maximal is not what separates the
# experiments that worked from the ones that did not, and the tidy story
# should not be repeated.
#
# Kept parameterised because the sweep is cheap to re-run and the next
# hypothesis about this family will want it.
stack_fraction: 1.0

# Crit-damage multipliers, converted into the equivalent Critical Chance the
# model already prices — measured, and the first pricing experiment here to
# ship ON.
#
# combat.py is calibrated to 0.0% over twelve in-game readings and two exist
# purely to pin crit: the multiplier is 1.50 where two published sources said
# 1.65, and Deathbringer's +35% ADDS onto it to reach 1.85 rather than
# multiplying to 2.0. Nothing had ever asked. efficiency prices stat columns
# and a crit-damage bonus is not a stat; damage_value.item_damage_gain walks
# ability components and never touches the basic-attack channel crit lives on.
# So the one item whose passive this project knows the exact value of was
# priced at zero, called premium at +488, and taken 0 times while 40% of the
# community builds that reach it buy it.
#
#     leakage-free coverage        OFF      ON
#     probe   eff 0.70 : fit 0.30  36.1%   36.7%
#     best    eff 0.45 : fit 0.55  30.7%   31.6%
#
# Better on BOTH splits, unlike coherence and price_stacks. Deathbringer's
# residual goes +488 -> +196 and its tier premium -> fair.
#
# Converted into Critical Chance rather than given its own column because a
# column carried by one item is exactly determined — see MIN_STAT_CARRIERS. It
# is a FLOOR: the conversion uses the item's own 20% crit, so it prices the
# passive at 14 points, where a real 60%-crit build makes it worth 42.
price_crit_multipliers: true

# Items that convert one stat into another, priced against a REFERENCE build.
# Four qualify and three of them reach zero model cores:
#
#   Transcendence  +Strength     = 3%  of Mana from Items
#   Book of Thoth  +Intelligence = 5%  of Mana from Items
#   Rod of Tahuti  +Intelligence = 25% of Intelligence from items
#   Nimble Ring    per 10 Intelligence: +1 Attack Damage, +1% Attack Speed
#
# Against the reference below that is +15 Strength on Transcendence (sheet 35),
# +25 Intelligence on Book of Thoth (sheet 30), +81 on Rod of Tahuti (sheet
# 80 - it literally doubles) and +32.5 Attack Damage / +32.5% Attack Speed on
# Nimble Ring, which lists neither at that size.
#
# ONE PASS, DELIBERATELY. Evaluating against a typical build rather than the
# core being assembled means there is no fixed point to converge: adding
# Transcendence would raise mana's value, pulling in more mana items, raising
# Transcendence again. So this prices the DETERMINISTIC case correctly (a mage
# builds Intelligence whether or not Tahuti is in the core) and the
# self-referential case conservatively - Transcendence gets +43%, where Ullr's
# actual 1,550-mana build would be +133%. See
# docs/plans/2026-08-13-mana-conversion-fit.md.
price_conversions: true

# How many times to re-assemble, re-pricing converters against the core the
# previous pass produced. 1 = the one-pass reference pricing above.
#
# MEASURED, AND THE CLOSEST CALL ON RECORD. Control is 1 pass at probe 37.6% /
# best 34.1%:
#
#     passes      1       2       3       4
#     probe    37.6%   36.7%   36.2%   36.9%
#     best     34.1%   33.3%   34.3%   34.5%
#
# No pass count beats the control on BOTH splits, which is the standard
# `price_crit_multipliers` and `price_conversions` were held to. Note the
# non-monotonicity: that is the fixed point failing to settle, and 3 of 87 gods
# oscillate outright between two cores.
#
# SHIPPED ON ANYWAY, 2026-08-14, BY THE MAINTAINER'S EXPLICIT DECISION - not
# because the gate approved it. It did not. The gate is worse on the probe
# corner (-1.4pp) and better on the split `calibrate` calls the leakage-free
# optimum (+0.2pp), and the item-level calibration is better on three of the
# four converters. Reading that as "on" is a judgement about which evidence to
# weigh, and it is a defensible one; what it is NOT is a measurement saying
# yes. Anyone re-deriving the numbers later should expect the coverage figures
# to look slightly worse than they did at `conversion_passes: 1` and should not
# read that as a regression to fix.
#
# IT ALSO COSTS RUNTIME. Every assembly runs up to three times, and `calibrate`
# assembles a core per god per weight combination, so the leakage-free sweep
# went from about a minute to over fifteen - long enough that the first two
# attempts to run it were killed. Two fixes brought it to ~7 minutes:
# `passives.stat_conversions` memoises its parse, and
# `assemble.conversion_score_bonus` checks that cheap lookup BEFORE building
# any stat maps, since 222 of the 226 items convert nothing. Budget ~7 minutes
# for `calibrate`; `recommend --all` and `validate --check` are unaffected.
#
# WHAT IT GETS RIGHT IS WORTH KEEPING IN VIEW. At 3 passes the item-level
# calibration improves on three of the four converters - Transcendence 2 -> 12
# model cores against 11 community builds, Rod of Tahuti 49 -> 32 against 34 -
# and Ullr's core gains Transcendence, reaching 5 of 6 with his community
# build and clearing the one open expert claim. It converges for him in two
# passes with no oscillation.
#
# So this is the second case where a change does exactly what a Masters player
# asked, on the item they named, and the coverage gate refuses it. The
# difference from #8 is that this one is split rather than uniformly worse: it
# loses 1.4pp on the probe corner and gains 0.2pp on the split `calibrate`
# itself calls the leakage-free optimum. Resolving it needs a measure that is
# not made of the community's build. Until then the discipline holds and the
# standard is not moved to fit a result someone likes.
conversion_passes: 3

# Median total across community builds THAT CARRY THE STAT AT ALL, from
# `passives.measure_conversion_reference`. The qualifier matters: 45 of 87 gods
# are physical and carry zero Intelligence, so a median over every build is 0,
# which would price Rod of Tahuti and Nimble Ring at nothing - the two items
# this exists to fix. It is also the wrong question, since Tahuti is only ever
# bought by a god who builds Intelligence.
conversion_reference:
  Max Mana: 500
  Intelligence: 325

# What an item with no community record scores on `win` -- the god's own median
# measured rate, not a global constant. SHIPPED ON.
#
# THE CONSTANT WAS NEVER NEUTRAL. SmiteBrain reports a win rate for a median of
# 8 items per god against a pool of 133, so for ~94% of everything ranked this
# number IS the win signal, and `win` carries the largest weight at 0.45.
# Measured on the 17,490-match scrape, 77 of 87 gods have a median measured win
# rate ABOVE 0.5 (mean 0.5538, per-god range 0.480 to 0.650). So the flat 0.5
# scored every unmeasured item BELOW the typical measured one, which is a
# systematic +0.0242 on `total` handed to an item purely for appearing in the
# community data.
#
# That is not small. Ullr's items ranked 3rd through 10th span 0.0130 of
# `total`, so the bonus for being community-built was 186% of the entire
# decision margin. The `win` signal was not mostly measuring outcomes; it was
# mostly expressing a preference for what the community already buys -- the
# leakage of STATE.md section 1, sitting inside the model rather than inside
# the metric.
#
# THE COVERAGE DROP IS THE POINT, NOT A COST. Headline coverage 59.3% -> 48.1%,
# win-weighted 60.2% -> 49.0%, 0%-coverage gods 3 -> 5, 50 of 87 Conquest cores
# changed. Coverage measures agreement with the community, and what was removed
# is a term that manufactured that agreement. Unlike the entries in section 4
# this is not a hypothesis about why the gate punished a change: the term's
# size and direction are derivable, and it is the gate's own target.
#
# Nothing leakage-free can adjudicate this either way -- `calibrate` zeroes
# `win` by construction. The argument is that comparing a per-god distribution
# against one global number is a units error, and that 0.5 is demonstrably not
# the middle of any real distribution.
#
# Set false to restore the flat constant; `unknown_win_rate` still sets it.
unknown_win_per_god: true

# ── Build coherence — measured, and shipped OFF ────────────────────────────
# The one term that scores a BUILD rather than an item: an item's worth is
# discounted by how much of its stat line the core already holds
# (`assemble.coherence_multiplier`). Proposed after a Masters player's review
# said the recommender "doesn't consider the build as a whole", which the data
# backed — Anubis's core carried Penetration on 6 slots of 6 where his own
# playerbase carries it on 4.
#
# Measured against the LEAKAGE-FREE gate (eff 0.45 : fit 0.55, win and pick
# zeroed; random-core baseline 5.8%):
#     0.00  32.1%   0.20  32.2%   0.30  28.2%   0.50  24.0%   1.00  16.6%
# Flat to 0.2 and then monotonically worse. Restricting the penalty to stats
# with real in-game diminishing returns (penetration, cooldown, lifesteal,
# attack speed, crit, tenacity) — leaving uncapped power alone — does not
# rescue it: 0.15 -> 30.1%, 0.30 -> 27.8%, 1.00 -> 17.7%.
#
# The likeliest reason, and it is a flaw in the idea rather than in the gate:
# real builds ARE stat-concentrated. A crit carry stacks crit and a mage stacks
# intelligence, so a term that penalises duplication is pushing away from the
# shape of every focused build in the game. What is wrong with Anubis is not
# duplication in general, it is duplication PAST A CAP — and the hard version
# of that, `stat_caps`, already exists and already measures as changing
# nothing. Turning this on needs a formulation that can tell a focused build
# from a redundant one, which neither of these is.
coherence: 0.0

# ── Hybrid scalers: when the god's damage_type label is not the whole story ──
# A god carries ONE damage_type, and the recommender used it as a hard gate:
# a physical god could not be shown a single Intelligence item. SMITE 2 kits
# are not that clean. Measured from the per-ability coefficients already in
# the scrape, 13 of 42 physical gods take >=35% of their ability damage off
# Intelligence and 8 of 37 magical gods take >=35% off Strength. Neith is 55%
# Intelligence, and the community builds her full Intelligence — a build the
# model could not express, scoring her a structural 0% with none of her six
# community items even visible.
#
# `min_off_share` is where the off-type stat stops being incidental. Swept
# 2026-08-05 across 0.10-0.55: coverage is flat within noise everywhere, with
# 0.30 the best point (53.4% -> 53.8%, rank correlation 0.552 -> 0.567), so
# this is set on the reading that a third of a kit's damage is not a rounding
# error rather than on a peak the data cannot really resolve.
# `min_abilities` is the confidence floor kit.py already uses: under 3 parsed
# scaling abilities the share is an artifact of a sparse scrape (Artio and
# Ullr scrape 2 abilities each), and those gods keep the strict label.
hybrid_scaling:
  enabled: true
  min_off_share: 0.30
  min_abilities: 3

kit_blend: 0.3       # how much the parsed ability-scaling profile skews god-fit (0 = role map only).
                     # Swept 2026-07-22: 0.3 captures the full coverage gain (Susano 80->100%)
                     # with the smallest Spearman cost (0.375->0.331); 0.5+ costs more, adds nothing.

# Ability upgrade order is DERIVED (no source scrapes it) — see abilities.py.
abilities:
  ult_levels: [5, 9, 13, 17]   # SMITE 2: ult unlocks at 5, then every 4
  early_points: 1              # one point in each non-ult ability first
  max_levels: 20

# ── Draft-aware builds (2026-07-23, proportional scaling 2026-07-25) ──
# How an entered enemy/ally comp skews item scores. The viewer is static, so the
# browser applies these as a tag/stat overlay on the per-god base scores shipped
# in index.json (`god_item_scores`). Bonuses scale by SHARE of the enemy team
# (matching count / enemy-team size), not raw count — this makes team size
# mode-agnostic: 2 healers out of 3 in Joust is a bigger threat than 2 out of 5
# in Conquest, and both are captured correctly with no per-mode retuning.
# `per_share` is calibrated so a full 5-god Conquest comp lands where the old
# per-enemy formula did (per_share ~= old per_enemy * 5, i.e. 0.02 * 5 = 0.1).
# `max_bonus` clamps an item's TOTAL bonus so a scary comp shifts a slot or
# three, never rewrites the build into full defense.
draft:
  score_cap: 40          # items shipped per god (a god's #60 item can't win a slot)
  # Clamp on the bonus any one item can receive. The CEILING IS RAISED TO THE
  # STRONGEST SINGLE CHANNEL (see draftBuild.adaptedCore): this bounds many weak
  # channels stacking into a rewrite, which is what the clamp is for, without
  # vetoing one channel that genuinely earned more.
  #
  # Applied to the sum alone it did veto exactly that, and hurt the highest-
  # leverage counter-buy in the game worst. A healer comp is also a CC and tank
  # comp, so anti-heal shared one fixed budget with penetration and cc-immunity
  # and lost. Measured on the shipped data with the real overlay, of the 31 gods
  # who can buy anti-heal at all:
  #
  #                          clamp the sum      ceiling >= strongest
  #     healers 4 of 5          16 / 31              31 / 31
  #     healers 2 of 5          16 / 31              16 / 31
  #     healers 1 of 5           8 / 31               8 / 31
  #     no healers               3 / 31               3 / 31
  #
  # Read the first two rows together: under the old rule TWICE THE EVIDENCE
  # produced the identical build, because the bonus doubled and the clamp ate
  # the difference. Nothing but the 4-of-5 row moves, and churn on a no-threat
  # comp is unchanged at 1.89 — raising max_bonus instead reached the same
  # anti-heal numbers only by loosening every channel on every draft.
  #
  # The B6 per-item damage channel is excluded from "strongest": it is a
  # continuous measurement rather than bounded evidence, so it keeps the flat
  # cap. So does the negative side; a penalty is not a well-evidenced answer.
  max_bonus: 0.12
  per_share: 0.1         # weight per matching share of the enemy team (count / enemyCount)
  tag_bonus:             # threat -> item effect_tag
    # anti-heal is weighted 2x because it is the highest-leverage counter-buy in
    # the game AND it starts far down the base ranking (Divine Ruin is Agni's
    # #20, sitting 0.063 below his 6th slot). Measured 2026-07-23 across 40 gods
    # vs a 2-healer comp: weight 1.0 promoted anti-heal for only 3/40 gods (i.e.
    # effectively never), 2.0 promotes it for 11/40 — a meaningful minority,
    # which matches how anti-heal is actually bought.
    healers: {anti-heal: 2.0}
    lockdown: {cc-immunity: 1.0, peel: 0.4}
    crit: {anti-crit: 1.0}
    # Three mechanisms answer a tank and until 2026-08-19 only one of them had
    # a name: strip their protections (`protection-shred`), pierce them
    # (`penetration`), or bypass them by scaling off health
    # (`percent-health`). The two new ones take protection-shred's existing
    # weight rather than a fresh number — same threat, same answer, and there
    # is nothing here to calibrate a distinct value against.
    #
    # UNMEASURED, AND IT CANNOT BE OTHERWISE. This block is read only by the
    # viewer's draft overlay, which `smite.calibrate` never runs, so no gate in
    # this project can confirm or refute it — the same objection that keeps
    # `threat_kit.py` out of scope. The gate-visible half of the same fix is
    # `offense_tags` above, which carries both of these tags and IS measured.
    tanks: {protection-shred: 1.0, penetration: 1.0, percent-health: 1.0}
    # NOTE there is deliberately no `walls` entry here. A player-made wall is
    # answered by Shell of Rebuke, which is a RELIC — `scoring.is_buildable`
    # excludes relics from the six core slots because the game gives them
    # their own slot, so a tag bonus aimed at it could never do anything. It
    # is recommended through `draft.relics` instead.
  # Threat -> relic, for answers that live in the relic slot rather than in
  # the build. Separate from tag_bonus for a structural reason, not a
  # stylistic one: nothing here competes with the six core items, so there is
  # no displacement to compute and no bonus to clamp — it is a straight
  # "this comp calls for this relic" lookup.
  relics:
    walls:
      item: Shell of Rebuke
      # Its field grants player and player-made wall passthrough for its
      # duration, which is the only counter in the game to being boxed in.
      because: walks your team out of their walls
  stat_bonus:            # threat -> item stat
    magical: {Magical Protection: 1.0}
    physical: {Physical Protection: 1.0}
    tanks: {Penetration: 0.6}
  # Stat bonuses that must be scaled by the god's OWN archetype before they
  # apply, using the `defense_affinity` the index ships per god.
  #
  # These three lines are keyed on what the ENEMY is, and were applied flat. So
  # a Hunter facing a magical comp was told "they are magical, become tankier"
  # — Magical Protection at 1.0 against Penetration's 0.6, for a god whose
  # whole build is damage. Measured across 10 damage gods vs a 4-tank /
  # 4-magical comp: protection items in the core went 12 -> 25, with Apollo and
  # Anhur both gaining Genji's Guard. Against tanks a carry wants penetration.
  #
  # Only the DEFENSIVE entries are listed. Penetration deliberately is not:
  # it is offensive, every damage god wants more of it against tanks, and the
  # role table happens not to list it for Carry/Sharpshooter/Hunter — so
  # scaling it by the same affinity would zero out the exact response this
  # change exists to encourage.
  archetype_scaled_stats: [Magical Protection, Physical Protection, Max Health]
  ally_covered: -0.5     # multiplier delta when an ally already covers that job
  ally_gap: 0.5          # multiplier delta when NOBODY covers it
  # How much of a draft bonus survives when YOUR OWN CORE already covers the
  # job. The same judgement `ally_covered` makes about a teammate, applied to
  # the build the overlay is actually rewriting.
  #
  # Without it the overlay paid the full anti-heal bonus to a second anti-heal
  # item while the first was already in the core, and that second copy
  # displaced whatever the build still genuinely needed. A recommended swap has
  # to be better than what it removes GIVEN the other five slots — answering a
  # threat twice is not twice as good, and the second copy is bought with a
  # slot that was doing something else.
  #
  # 0.35 rather than 0: a second answer is worth something (an enemy can build
  # around one, and effects stack imperfectly), just not full price. Applies
  # only to POSITIVE bonuses; a penalty is not a job that can be already done.
  #
  # MEASURED, AND IT IS A GUARD RATHER THAN A FIX. Across four enemy comps
  # (5 healers / 5 tanks / mixed / crit-heavy) x 87 gods = 348 adapted builds,
  # the old pay-in-full logic doubled up on a bonused tag exactly ONCE:
  # Mercury took Screeching Gargoyle and Eye of the Storm, both `peel`, against
  # five healers. `max_bonus` already bounds the whole overlay at 0.12, which
  # is small enough that a second copy rarely out-scores a fresh item on its
  # own merits. So this changes 1 of 348 builds today.
  #
  # It is kept for the same reason `assemble.stat_caps` is kept while changing
  # 0 of 261 cores: the rule is real and the cost is nil, and it becomes
  # load-bearing the moment `max_bonus` is raised or more tagged items enter
  # the pool. Do not read it as currently doing much.
  #
  # TAGS ONLY, deliberately — see `draftBuild.adaptedCore`. Damping stats too
  # changed 70-79 of 87 cores per comp, which is a different model rather than
  # a correction: protection is a quantity that scales, not a job you either
  # have or don't.
  self_covered: 0.35

# ── Disagreement-report findings (2026-07-22, see Analysis/_disagreements.md) ──
# Tank archetypes undervalued CDR items the community actually runs
# (Breastplate of Valor / Genji's Guard / Pharaoh's Curse): adding Cooldown
# Rate to the tank maps doubled Hercules (20->40%) and Ymir (25->50%)
# coverage; effect plateaus at 0.5. Merged on top of the code defaults.
role_stats:
  Tank:     {Cooldown Rate: 0.5}
  Guardian: {Cooldown Rate: 0.5}
  Support:  {Cooldown Rate: 0.5}
  # Carry/bruiser fit tuning (2026-07-23 spot-check). Deep-merges over the
  # code-default maps. (a) Carries were building ability-assassin items
  # (Penetration/CDR) — assert the basic-attack identity so attack-speed/crit
  # items dominate the fit for the Carry role + true-ADC specs. (b) Bruisers
  # collapsed to pure defense — raise Strength so Solo/Brawler/Warrior keep a
  # damage item or two. Note: an ability-tagged carry (e.g. Cupid: Nuker/
  # Healing) still leans on-ability by design — that reflects its wiki kit.
  Carry:        {Attack Speed: 1.3, Critical Chance: 1.3, Strength: 0.8, Lifesteal: 0.5}
  Constant:     {Attack Speed: 1.0, Critical Chance: 0.8, Strength: 0.6}
  Solo:         {Strength: 1.1}
  Brawler:      {Strength: 1.1}
  Warrior:      {Strength: 1.1}

# The community double-stacks sustain on physical basic-attack carries
# (Devourer's Gauntlet + Riptalon on Cernunnos, 63%/24% pick) — the flat
# lifesteal cap of 1 forbade the pair (a "constraint conflict" in the report).
# First matching rule wins; explicit flavor/aspect caps always beat these.
# Scoped to physical carries: a mode-wide cap of 2 cost Agni 80->60%.
lifesteal_caps:
  - {damage_types: [physical], match_any: [Carry, Hunter, Sharpshooter], max_lifesteal: 2}

# ── Stat caps ──────────────────────────────────────────────────────────────
# Stats the game stops paying for past a threshold. No single item comes close
# to one — the biggest Tenacity item gives 15 against a cap of 50 — so this is
# not a pricing rule; the gold model is right to price a point linearly. It is
# an assembly rule: four Tenacity items give 60 and ten of that buys nothing.
# The assembler refuses an item only when its whole contribution is already
# capped out, never when part of it still fits.
#
# SMITE 2's CAP SYSTEM IS NOT SMITE 1'S, and the differences are the reason
# this list is short. Surveyed 2026-08-21 against the SMITE 2 wiki's Stats
# page (wiki.smite2.com/w/Stats), read as raw wikitext so the quotes are the
# source's own words. Keys carry the same unit-aware identity as
# `efficiency.stat_key`, so `Penetration %` and `Penetration` are separate
# budgets — see `assemble._capped_out`.
#
# DOCUMENTED — the wiki states the cap outright:
#   Tenacity   "capped at 50% Tenacity acquired from items"
#   Plating    "This stat is capped at 35 total Plating"
#   Dampening  "This stat is capped at 35 total Dampening"
#
# INFERRED — the cap EXISTS but no SMITE 2 source states its value:
#   Penetration %  40    Penetration (flat)  50
# That the cap exists is MEASURED, from data this repo already scrapes: three
# item notes — Titan's Bane, Obsidian Shard and Dominance — carry the sentence
# "This effect ignores the Penetration cap", and `insource:/Penetration cap/`
# on the wiki returns those three pages and nothing else. The wiki references
# a cap it never defines; its Penetration section says only that the stat
# "allows you to ignore a percentage of a target's ... Protections".
#
# The VALUES are the weakest numbers in this file. Every source quoting 40/50
# traces to SMITE 1 material (smite.fandom.com, a Dignitas SMITE 1 guide, the
# dead smitegame forums), and SMITE 1 itself cut its percentage cap by 20%
# relative in Update 10.4 (April 2023), 40% -> 32%. So 40 matches neither
# current SMITE 1 nor any stated SMITE 2 figure — it is a pre-2023 SMITE 1
# value, and it is here as a GUARD, not as a fact. `combat.PCT_PEN_CAP` and
# `FLAT_PEN_CAP` hold the same pair on the same tier; if either is ever
# measured in game, both move together.
#
# Both would bind if the guard could reach them — the pool's top six
# percentage items total 80% against 40, and its top six flat items total 60
# against 50. It cannot reach them today; see `assemble._capped_out` for the
# structural reason and the measurement.
#
# DELIBERATELY ABSENT, because SMITE 2 does not cap them:
#   Cooldown Rate  — renamed and re-mechanised from SMITE 1's capped CDR. The
#     wiki: "every 1 Cooldown Rate allowing you to use abilities 1% more
#     often", i.e. a haste stat, CD = base x 100/(100+CDR). It diminishes
#     itself, so there is nothing to cap. SMITE 1's 40% does not carry across.
#   Attack Speed   — no stated cap. SMITE 1's 2.5 attacks/sec was a cap on the
#     EFFECT, a function of the god's base rate and level, never on an item's
#     "+45%"; it is not expressible as a sum over item stats at all.
#   Critical Chance, Echo — no stated cap. 100% is a natural bound on a
#     probability, which is again the effect and not the stat.
#   Lifesteal, Pathfinding — "33% effectiveness" against minions and in combat
#     respectively. Those are SCALES, not caps, and `combat.py` already holds
#     both (LIFESTEAL_MINION_SCALE, PATHFINDING_COMBAT_SCALE).
#   Healing Reduction — DOCUMENTED at "25% from items and it does not stack
#     with itself", but it is not a `stats` key on any of the 226 items: all
#     four anti-heal items apply exactly 25% from passive text, so ONE of them
#     is already the cap and a second adds nothing. That is a non-stacking
#     rule rather than an additive budget, so it cannot be expressed here.
#     The `anti-heal` tag and `draft.self_covered` are where it would live.
#   Protections, Strength, Intelligence, Health, Mana, Movement Speed — no cap
#     stated for any of them.
stat_caps:
  Tenacity: 50
  Plating: 35
  Dampening: 35
  Penetration %: 40      # INFERRED — see above; guard, not a fact
  Penetration: 50        # INFERRED — flat; its existence is unattested for S2

# ── Cap overflow: what the points past a cap are worth ────────────────────
# Marks a candidate's EFFICIENCY down by the gold value of the capped stat the
# core cannot use, at the moment it is considered. `assemble.stat_caps` above
# is the reject half of the same mechanic and structurally cannot reach this
# case: it refuses an item only when EVERY stat it carries is capped, and no
# penetration item in the pool is pure penetration. Charging the overflow says
# the thing a reject rule cannot — "the penetration is wasted, the Intelligence
# is not". Mechanics and evidence in `assemble.cap_overflow_penalty`.
#
# 1.0 is the PRINCIPLED value, not a tuned one: a gold that buys nothing is
# worth exactly minus what a gold is worth, so the charge enters `total` at the
# efficiency signal's own weight and no more. Swept 2026-08-21 over every god x
# mode x flavor entry, leakage-free coverage at both splits:
#
#     strength   cov @eff 0.70   @eff 0.45   builds over cap   cores changed
#       0.00         37.7%         38.4%          47 of 2423       — control
#       0.25         37.7%         38.4%          44                 3
#       0.50         37.7%         38.4%          42                 5
#       1.00         37.7%         38.4%          29                19
#       2.00         37.5%         38.4%           5                52
#
# So it removes 38% of the waste for NO measurable coverage cost — coverage is
# identical to control to the digit at the shipped setting. 2.0 removes 89% of
# it and starts to cost, and it is also the setting that asserts a wasted gold
# hurts more than an earned gold helps, which nothing supports. Note that it
# does not drive the overshoot to zero and should not: 29 builds still overflow
# because their alternative really is worse, which is the difference between
# pricing the waste and forbidding it.
#
# IT DOES NOT REMAIN FREE IF THE CAP IS WRONG, and the cap is the weakest
# number in this file. Re-swept with `Penetration %` at 32 — SMITE 1's own
# post-2023 value, the most likely way 40 is wrong:
#
#     strength   cov @eff 0.70   @eff 0.45   builds over cap   cores changed
#       0.25         37.4%         38.1%         257 of 2423        65
#       0.50         36.7%         37.7%         197                119
#       1.00         36.7%         37.7%         110                213
#       2.00         33.3%         37.9%          18                304
#
# Every one of those is inside the bootstrap interval (~±5pp), so none is a
# measured loss — but the direction is consistent and the blast radius is 11x
# larger. The SHAPE degrades gracefully, which is why it is a charge and not a
# refusal: `max(0, amount - headroom) x price` is continuous in the cap, so a
# wrong cap moves a kink instead of switching a rule on. The COST does not, and
# whoever measures the real cap should re-run this sweep alongside it rather
# than assume the 1.0 here survives.
cap_overflow: 1.0

# ── Offense tags ──────────────────────────────────────────────────────────
# Which effect-tags mark an item as offensive to `god_fit_score`, and what each
# is worth. Moved here from a hardcoded set in `scoring.py` on 2026-08-19: it
# was the only tag weight in the model that did not live in this file, so
# adding a tag to it was a code change and sweeping it meant editing Python.
#
# `penetration` was added with the tag itself and is the one wire of that pass
# the coverage gate can see — 35.5% -> 35.9% at the probe split and 34.8% ->
# 36.1% at eff 0.45, against a 5.7% baseline.
#
# TWO FOLLOW-UPS MEASURED THE SAME DAY. BOTH SHIP ON, AND ONLY TOGETHER.
#
#   variant                         eff 0.70:fit 0.30   eff 0.45:fit 0.55
#   HEAD, before any of this pass          35.5%               34.8%
#   penetration only                       35.9%               36.1%
#   + percent-health in this map           35.9%               36.1%
#   offense_tags_additive: true            35.9%               36.1%
#   both together                          35.5%               36.7%
#
# Each ALONE is an exact no-op, for two different reasons that only surface
# together. `percent-health` alone buys nothing because the flat rule gives its
# three big carriers (Heartseeker, Qin's Blade, Soul Reaver) nothing they did
# not already have from `burst`, and its four bare carriers (Ethereal Staff,
# Eye of Erebus, Sanguine Lash, Totem of Death) do not reach a core either way.
# `additive` alone buys nothing because almost no item carries two offense tags
# yet. Adding `percent-health` is what CREATES the two-tag items, so the two
# only interact when both are on.
#
# READ THE TABLE AGAINST HEAD, NOT AGAINST THE ROW ABOVE. Measured the other
# way, `both` looks like a -0.4pp regression on the probe split and gets
# rejected for the diverging-splits signature that sank `conversion_fit`
# (STATE.md 4.9). That is the wrong baseline: `penetration only` was never
# committed. Against what IS committed, `both` is +0.0 and +1.9pp — worse than
# HEAD on neither split — and it buys something `penetration only` costs.
#
# WHAT IT BUYS is Ullr's expert claim. `penetration only` moves Heartseeker out
# of his Conquest core for Titan's Bane and takes `expert_review` from [clear]
# to [partial]; `both` puts it back. The flat rule is exactly why it was lost:
# Heartseeker carries `burst` AND `percent-health` and scored the same as an
# item carrying one, so `penetration` on Titan's Bane cleared it by a step
# Heartseeker could not answer. Additive is not a workaround for that, it is
# the correction — an item that answers a tank two ways is worth more than an
# item that answers it one way, and the flat step could not say so.
#
# That claim was resolved BY HAND on 2026-08-14, by a maintainer who turned
# `conversion_passes` to 3 and accepted probe 37.6% -> 36.2% against best
# 34.1% -> 34.3% to get those four items into that core. Shipping
# `penetration only` would have silently reversed that decision for +0.4pp
# inside a +-5pp CI. The precedent is the same reviewer, the same god and the
# same item, and it points here.
offense_tags:
  burst: 0.1
  execute: 0.1              # declared since 2026-07-16, still zero carriers
  protection-shred: 0.1
  penetration: 0.1
  percent-health: 0.1
# true = an item's offense tags SUM. Only 7 items carry two, all of them items
# that answer a tank in more than one way; see the table above.
offense_tags_additive: true


# ── Build flavors ─────────────────────────────────────────────────────────
# Each flavor is a scoring overlay producing an extra "suggested" build. It's
# emitted only for gods whose damage type is in `damage_types` (null = any) and
# whose tokenized role+specs intersect `match_any` (null = any). `stats` skews
# god-fit; `tag_bonus` rewards tagged items; `max_lifesteal` caps sustain items.
flavors:
  # The build a mana converter defines. Transcendence turns 3% of your Mana
  # from Items into Strength and Book of Thoth 5% into Intelligence, so every
  # mana item makes the converter better and the converter makes every mana
  # item into power. `price_conversions` prices that against a TYPICAL build,
  # which is deliberately conservative and leaves both items under-picked
  # (Transcendence reaches 1 core against 11 community builds, Book of Thoth 0
  # against 22). This is the other half: an explicit archetype where the mana
  # build is the user's choice rather than something the assembler has to
  # discover, which sidesteps the fixed point that makes two-pass assembly
  # risky. See docs/plans/2026-08-13-mana-conversion-fit.md.
  #
  # `require` seeds the core with three Max Mana items before filling by score,
  # so the converter is bought into a build that actually feeds it. Gated by
  # `requires_item`: without a converter in the god's pool this is just a pile
  # of mana, and the tab would be empty of the thing that justifies it.
  mana-stack:
    damage_types: null
    # Every god can build ONE of the two converters - Transcendence is a
    # Strength item and Book of Thoth an Intelligence one - so `requires_item`
    # alone offered this to all 87. The build only makes sense for a god who
    # turns power into damage, so it is gated on the damage-dealing roles the
    # way the other offensive flavors are.
    match_any: [Carry, Hunter, Sharpshooter, Mage, Mid, Nuker, Assassin,
                Jungle, Slayer, Sniper, Burst]
    requires_item: [Transcendence, Book of Thoth]
    # Max Mana is deliberately the SMALLEST weight here, which reads backwards
    # for a mana build and is not. `require` already guarantees three mana
    # carriers; the overlay's job is to decide WHICH ones, and at 1.2 it chose
    # Genji's Guard and Breastplate of Valor - the items with the most mana on
    # them, which are tank items. Mana is the fuel, not the goal: what the
    # converter turns it into is power, so power is what the overlay weights.
    stats:
      Strength: 1.4
      Intelligence: 1.4
      Penetration: 0.9
      Cooldown Rate: 0.7
      Max Mana: 0.5
    require: {stat: Max Mana, min: 3}
    max_lifesteal: 1
  crit:
    damage_types: [physical]
    match_any: [Carry, Sharpshooter]
    stats: {Critical Chance: 1.5, Attack Speed: 1.2, Strength: 0.8}
    max_lifesteal: 1
    require: {stat: "Critical Chance", min: 3}
  burst:
    damage_types: null
    match_any: [Nuker, Burst, Slayer, Sniper, Mid]
    stats: {Strength: 1.0, Intelligence: 1.0, Penetration: 1.5, Cooldown Rate: 1.0}
    max_lifesteal: 1
  bruiser:
    damage_types: null
    match_any: null
    stats: {Max Health: 1.0, Physical Protection: 0.8, Magical Protection: 0.8}
    tag_bonus: {sustain: 0.3}
    max_lifesteal: 2
  anti-tank:
    damage_types: null
    match_any: null
    stats: {Penetration: 2.0}
    tag_bonus: {protection-shred: 0.3}
    max_lifesteal: 1
  # ── Focused builds ──────────────────────────────────────────────────────
  # These replace the old `fun-crit`, which was explicitly off-class and had
  # its meta signals zeroed because nobody plays a crit Ymir. A build nobody
  # should follow is not worth a tab; a build with a deliberate FOCUS is.
  attack-speed:
    damage_types: null
    match_any: null
    stats: {Attack Speed: 1.5, Strength: 0.8, Lifesteal: 0.5, Attack Damage: 1.0}
    max_lifesteal: 2
    require: {stat: "Attack Speed", min: 3}
  cooldown:
    # Cooldown Rate is a RATE on the same 100/(100+x) curve as protections —
    # measured, see combat.py. 100 of it is twice the casts, which is why an
    # ability-uptime build is a real archetype rather than a stat pile.
    damage_types: null
    match_any: null
    stats: {Cooldown Rate: 2.0, Intelligence: 0.6, Strength: 0.6}
    max_lifesteal: 1
    require: {stat: "Cooldown Rate", min: 3}

  # ── Off-type power ──────────────────────────────────────────────────────
  # For playing a god outside their usual lane. Each BYPASSES THE DAMAGE
  # FILTER on purpose — that filter is what stops a physical god ever seeing
  # an Intelligence item, and it is exactly what has to give for Sol carry or
  # a full-Intelligence Neith to be expressible at all.
  #
  # `requires_scaling` gates them on the god's own measured coefficients, so
  # the tab appears only where the kit supports it. Neith scales 1.00 Strength
  # and 0.95 Intelligence and gets all three; Scylla scales 0.28 Strength and
  # gets none. That gate is the difference between an alternative and a trap.
  strength:
    bypass: [damage_filter]
    damage_types: [magical]          # off-type by construction
    match_any: null
    requires_scaling: {Strength: 0.5}
    stats: {Strength: 1.5, Penetration: 1.0, Attack Speed: 0.6}
    max_lifesteal: 1
  intelligence:
    bypass: [damage_filter]
    damage_types: [physical]         # off-type by construction
    match_any: null
    requires_scaling: {Intelligence: 0.5}
    stats: {Intelligence: 1.5, Penetration: 1.0, Cooldown Rate: 0.8}
    max_lifesteal: 1
  str-int:
    bypass: [damage_filter]
    damage_types: null
    match_any: null
    requires_scaling: {Strength: 0.5, Intelligence: 0.5}
    stats: {Strength: 1.2, Intelligence: 1.2, Penetration: 1.0}
    max_lifesteal: 1

# ── God aspects ─────────────────────────────────────────────────────────────
# Per-god scoring overlay (same shape as a flavor) applied when the viewer's
# Aspect toggle is on. Keyed by god name. Hand-tuned from each aspect's kit text;
# light where the aspect barely changes the build. Stat keys match item stats
# (Strength / Intelligence / Attack Speed / Max Health / Cooldown Rate /
# Lifesteal / Physical Protection / Magical Protection / …).
aspects:
  Cernunnos:      # Strife — basics become melee cleave autos
    stats: {Strength: 1.0, Attack Speed: 0.8, Lifesteal: 0.8, Max Health: 0.6}
    tag_bonus: {sustain: 0.2}
    max_lifesteal: 2
  Hercules:       # Preservation — ally-heal bruiser/tank
    stats: {Max Health: 1.2, Physical Protection: 0.9, Magical Protection: 0.9}
    tag_bonus: {aura: 0.3, sustain: 0.2}
    max_lifesteal: 2
  Ra:             # Thermotherapy — heals allies, abilities lose scaling -> support
    stats: {Cooldown Rate: 0.8, Magical Protection: 0.5, Max Health: 0.6, Intelligence: 0.4}
    tag_bonus: {aura: 0.3, sustain: 0.2}
  Chronos:        # Relativity — team time-field, loses Time Lord Int -> support mage
    stats: {Cooldown Rate: 0.8, Intelligence: 0.6, Magical Protection: 0.4, Max Health: 0.4}
    tag_bonus: {aura: 0.3}
  Morgan Le Fay:  # Cursed Crown — melee, %max-HP damage
    stats: {Max Health: 1.0, Intelligence: 0.8, Magical Protection: 0.4}
    tag_bonus: {sustain: 0.2}
    max_lifesteal: 2
  Agni:           # Combustion — ignite via basics; still a burst mage
    stats: {Attack Speed: 0.4}
  Chiron:         # Heroic Tutor — damage copy + ally buffs; still a carry
    stats: {Attack Speed: 0.3}
    tag_bonus: {aura: 0.1}

# ── Game modes ────────────────────────────────────────────────────────────
# A mode is not a reskin of Conquest. It changes what the map rewards, and it
# can change which items exist at all. Three levers, in order of bluntness:
#
#   excluded_items  the item is not in this mode's shop. Hard filter, applied
#                   before scoring, and no flavor can bypass it — a build the
#                   player cannot assemble is not a build.
#   signals         which evidence counts. SmiteBrain publishes Conquest only,
#                   so every other mode scores on math alone (efficiency + fit,
#                   renormalized) rather than borrowing Conquest's win rates,
#                   which describe a different game.
#   tag_bonus       what the map rewards, per effect tag.
#
# `conquest` is the default and takes no overlay: three lanes, jungle camps,
# towers and phoenixes, ~30min games, and the meta data we actually have.
modes:
  conquest:
    tag_bonus:
      # The ward economy is not free value. See `ward-economy` in _tags.yaml
      # for the measurement; Arena already drops these items outright because
      # the mode has no wards, and this is the same judgement made continuous
      # for the mode where wards exist but only some players farm them.
      # Sized by sweeping it against BOTH gates, which agree — rare enough
      # here to be worth stating. Against the 34 Support/Solo Conquest gods,
      # whose players buy this item ZERO times on the current scrape:
      #
      #     bonus    leakage-free    cores holding it
      #      0.00        33.5%            18/34
      #     -0.15        34.1%             7/34
      #     -0.25        36.1%             0/34
      #     -0.35        36.1%             0/34
      #     -0.50        36.1%             0/34
      #
      # -0.25 is where it saturates: stronger values buy nothing, so this is
      # the point at which the item simply stops out-scoring real ones rather
      # than a knob turned until the answer looked right. It first shipped at
      # -0.15, which the expert register caught as a regression when a fresh
      # community scrape landed and the count went 4 -> 7.
      ward-economy: -0.25

  # One lane, no jungle to rotate through, and you fight the same three people
  # all game: sustain and anti-heal decide who can stay on the lane, auras
  # always have a body next to them, and there is nowhere for mobility or a
  # second wave to matter.
  joust:
    signals: {efficiency: 0.5, win: 0.0, pick: 0.0, fit: 0.5}
    # Joust HAS wards, so the ward economy is real here and this item's stat
    # discount is no more free than it is in Conquest. It was getting neither
    # the Conquest penalty nor Arena's outright exclusion, and sat in 27 of the
    # 87 Joust cores as a result — one item, one mechanism, three different
    # treatments.
    #
    # UNMEASURED, and it cannot be otherwise: Joust has no community data at
    # all, so there is no coverage gate to move (STATE.md section 5). This is a
    # judgement about the mechanism carried over from the mode where it WAS
    # measured. Arena's excluded_items is the same kind of judgement, made the
    # same way, and predates it.
    tag_bonus: {sustain: 0.25, anti-heal: 0.3, aura: 0.2, wave-clear: -0.15,
                mobility: -0.1, ward-economy: -0.25}
    # Correct the model with CONQUEST's community record, minus the parts of it
    # that do not transfer. SmiteBrain publishes Conquest only, so without this
    # the Hybrid build simply did not exist here — `hybrid_core` returned the
    # model core untouched for all 89 gods and the caller declined to emit a
    # duplicate. Borrowed evidence is better than none, and is disclosed as
    # borrowed on the build itself.
    borrow_community:
      from: Conquest
      # MEASURED, AND INERT TODAY — in both modes, and worth stating before
      # anyone reads a rejection into a build that changed. Across all 89 gods,
      # the number of borrowed candidates carrying a rejected tag that ALSO
      # clear the confidence bar is ZERO: Joust screens 25 tagged candidates
      # and Arena 30, and every one of them was already going to fail on
      # evidence. Hybrid fires on 13 Joust and 14 Arena gods either way.
      #
      # Kept because it is a guard on the right thing, not because it is doing
      # work now. The bar is a Wilson lower bound against the god's own win
      # rate; loosen `hybrid.min_edge`, or let one stacker's Conquest record
      # strengthen, and Arena would otherwise start borrowing a record for an
      # item its players never finish building.
      #
      # The list is per mode, and it answers ONE question: does Conquest's
      # record about this item still describe what the item does here? That is
      # not the same question `tag_bonus` answers — that one prices an item,
      # continuously, for a mode where the evidence DOES apply.
      #
      #   mobility / wave-clear   this mode's own note above: "there is nowhere
      #                           for mobility or a second wave to matter". A
      #                           Conquest win rate for a rotation item is a
      #                           record of rotations Joust does not have.
      #
      # NOT rejected, deliberately:
      #   ward-economy  Joust HAS wards -- see the tag_bonus note above, which
      #                 says so in as many words. The mechanism is the same one
      #                 Conquest measured, so the record transfers; it is
      #                 priced at -0.25 for the same reason it is in Conquest,
      #                 not because it is foreign here.
      #   stacking      22.5 minutes is long enough to collect. `economy` and
      #                 `assemble.time_value_multiplier` already discount a
      #                 late item continuously, which is the right instrument
      #                 for "slower" -- rejection is for "does not apply".
      reject_tags: [mobility, wave-clear]
    # Joust is NOT a small Arena, and that is the whole finding. It has a Titan,
    # jungle camps and towers - structurally Conquest, paced faster. Its win
    # still happens at the END, so late items keep most of their value and the
    # decay is mild. What justifies any decay at all is the income: only ~90% of
    # the core is covered by spooling, the rest is farm, so a losing player may
    # never reach six items.
    #   start_gold      1,250     DOCUMENTED - OB1 notes, "Start: Level 3, 1250 Gold"
    #   gold_per_min      690     INFERRED - documented spooling is 7/sec = 420,
    #                             which alone reaches six items only at 33.8 min;
    #                             the remainder is farm, calibrated so the core
    #                             completes near the match-length midpoint.
    #   match_minutes    22.5     INFERRED - the SMITE 2 wiki's Joust page is a
    #                             stub with no length; 15-30 is secondary-source.
    #   uniformity        0.3     JUDGEMENT - Titan objective, so mostly endgame.
    economy: {start_gold: 1250, gold_per_min: 690, match_minutes: 22.5, uniformity: 0.3}
    label: "Joust — math + mode profile (no meta win/pick data)"

  # No towers, no phoenixes, no jungle camps, and no fog worth warding: one
  # open box where ten players are in range of each other almost continuously.
  # Minions still matter — escorting yours and killing theirs is how tickets
  # move — so wave-clear keeps a small positive rather than Joust's penalty.
  # Games are short, so the tag bonuses lean on effects that pay immediately.
  arena:
    signals: {efficiency: 0.5, win: 0.0, pick: 0.0, fit: 0.5}
    tag_bonus:
      aura: 0.3           # five allies permanently inside the radius
      anti-heal: 0.3      # sustain is universal here, so its counter is too
      sustain: 0.25       # continuous fighting, no lane phase to recover in
      cc-immunity: 0.2    # perpetual 5v5; chain CC is the way people die
      wave-clear: 0.1     # minion denial is the objective, not a lane chore
      ward-economy: -0.25 # no wards at all; excluded_items already drops these
      mobility: -0.1      # no camps or lanes to rotate between
    borrow_community:
      from: Conquest
      #   stacking   17.5 minutes is the whole scoring window. Conquest's
      #              record for Transcendence or Book of Thoth is a record of a
      #              FINISHED stack; what you get here is a part-built one, so
      #              the number describes an item you will not own. This is the
      #              mode where that stops being a discount and becomes a
      #              different item -- Joust deliberately does not reject it.
      #   mobility   "no camps or lanes to rotate between", per the tag_bonus
      #              note above.
      #
      # NOT rejected, deliberately:
      #   ward-economy  redundant here. `excluded_items` above is exactly the
      #                 two ward items, and an excluded item never reaches the
      #                 scored rows a candidate is drawn from. Listing it again
      #                 would read as load-bearing when it is not.
      #   wave-clear    Arena PRICES IT UP (+0.1): minion denial is the
      #                 objective, not a lane chore. Rejecting evidence about
      #                 the thing the mode is built around would be backwards.
      reject_tags: [stacking, mobility]
    # Arena has no ward game, so the vision items are absent from its shop.
    # This is the list to correct first if a build recommends something the
    # shop does not have — it cannot be derived: "forward" and "toward" both
    # contain "ward", and Eye of Erebus spawns a Watchful Eye without ever
    # using the word.
    # The only mode whose value accrues UNIFORMLY: 500 tickets falling from
    # 0:00, so a kill at minute 3 scores exactly as much as one at minute 15.
    # A sixth item bought at ~16 min of a 15-20 min match is therefore present
    # for almost none of the scoring, which is what the decay expresses.
    #   start_gold      1,250     DOCUMENTED - Arena page infobox
    #   gold_per_min      900     DOCUMENTED - 15 gold/sec spooling, OB28 notes
    #                             ("Decreased Gold Spooling: 21 -> 15", Arena).
    #                             NOTE the Arena page still prints 11/sec, which
    #                             is pre-OB1 and stale - patch notes win.
    #                             Conservative: combat income sits on top.
    #   match_minutes    17.5     DOCUMENTED - Arena page, "Average Length 15~20"
    #   uniformity        0.6     JUDGEMENT - tickets accrue continuously, but
    #                             the last fight still matters, so not 1.0.
    economy: {start_gold: 1250, gold_per_min: 900, match_minutes: 17.5, uniformity: 0.6}
    excluded_items:
      - Eye of Providence   # grants a Sentry Ward; pays gold for killing wards
      - Eye of Erebus       # spawns a Watchful Eye
    label: "Arena — math + mode profile (no meta win/pick data)"

# ── Build order (recommended purchase sequence) ─────────────────────────────
# Heuristic buy-order for suggested cores (we have no real build-path data).
# stage = default_stage + sum(tag_stage for the item's effect_tags) +
# cost * cost_weight. Core is sorted ascending by stage (ties: cost, then name).
# flex_count = how many lowest-scored core items situational swaps may replace.
build_order:
  default_stage: 0
  cost_weight: 0.0004
  flex_count: 2
  tag_stage:
    anti-heal: -1
    protection-shred: -1
    wave-clear: -1
    sustain: 0
    aura: 1
    mobility: 0

# ── Starters ──────────────────────────────────────────────────────────────
# The recommender stamps one starter per god: the highest-priority entry whose
# damage_types (null = any) include the god's damage type AND whose match_any
# (null = any) intersects the god's tokenized role+specs. Base -> level-20
# upgrade pairs verified from the wiki. Death's Toll is the priority-1 default.
starters:
  - {base: Gilded Arrow,          upgrade: Sharpshooter's Arrow, damage_types: [physical], match_any: [Carry, Sharpshooter, Hunter], priority: 10}
  - {base: Conduit Gem,           upgrade: Archmage's Gem,       damage_types: [magical],  match_any: [Mid, Nuker, Mage, Sniper, Carry, Burst], priority: 10}
  - {base: Bumba's Golden Dagger, upgrade: Bumba's Spear,        damage_types: null,       match_any: [Jungle, Slayer, Assassin], priority: 9}
  - {base: Warrior's Axe,         upgrade: Sundering Axe,        damage_types: null,       match_any: [Solo, Warrior, Brawler, Tank, Lockdown], priority: 8}
  - {base: Death's Toll,          upgrade: Death's Embrace,      damage_types: null,       match_any: null, priority: 1}
