# The passive catalogue — every buildable item's passive, classified by the
# SHAPE of the value it carries. Written 2026-09-02; the argument, the
# tractability verdict per class and the numbers are in docs/PASSIVES.md.
#
# This is a sidecar like _tags.yaml: hand-authored, refresh never touches it,
# and a test (`test_passive_catalogue.py`) holds it to the pool — every
# god-agnostic buildable item with passive text must have an entry, every class
# code must be in `classes`, and an item's `priced` list must agree with what
# the shipped pricing flags actually reprice. A new carve-out therefore has to
# come here and say which clause it priced.
#
# CLASSES ARE PER CLAUSE, NOT PER ITEM. An item lists every shape its text
# carries, primary first. "Priced today" is per clause too: The Executioner's
# Adaptive Stat is priced (A1) and its protection shred (B3) is not.
#
# WHAT A CLASS CODE SAYS. The letter is the family — which of the three
# questions the value fails on, if any:
#   A  a priced stat in disguise            currency yes, uptime yes
#   B  a combat quantity with an exchange rate into a priced stat
#                                            currency via combat.py, uptime
#                                            stated by the text or equal to 1
#   C  a priced or combat quantity gated by an UPTIME no source supplies
#   D  value whose RECIPIENT is not the god being scored
#   E  no currency at all — a game-state change
# The digit is the sub-shape. Tractability is a property of the class, argued
# once in docs/PASSIVES.md; per-item notes say only what the clause is and
# which reference or constant it would need.

classes:
  A1:
    name: grant-in-prose
    family: A
    what: "an unconditional grant of a stat the regression prices, written in the passive instead of in `stats`"
    precedent: "price_adaptive"
  A2:
    name: build-conversion
    family: A
    what: "a grant computed from a total over the rest of the build — one stat, or \"% of all Stats from Items\""
    precedent: "price_conversions"
  A3:
    name: build-branch
    family: A
    what: "which stat you get is decided by the build's own stat line, deterministically, with no uptime"
    precedent: "price_adaptive (branch chosen from the text)"
  A4:
    name: cooldown-return
    family: A
    what: "a cooldown refund that is a RATE or a standing fraction, so it converts to Cooldown Rate by `combat.cooldown_multiplier`"
    precedent: "none"
  A5:
    name: self-sustain
    family: A
    what: "a heal or shield on yourself — a rate converts to Health Regen, a standing shield to Max Health on one channel, a per-cast heal has no column"
    precedent: "none"
  B1:
    name: attack-channel-damage
    family: B
    what: "bonus damage on the basic-attack channel — flat on-hit, a proc at a stated hit interval, or a crit multiplier"
    precedent: "price_crit_multipliers"
  B2:
    name: cast-channel-damage
    family: B
    what: "bonus damage per ability hit, flat or scaled off your own stats or the target's health"
    precedent: "none"
  B3:
    name: target-shred
    family: B
    what: "reduces the target's protections — the self-share is `effective_protection`'s reduction terms, a penetration-equivalent"
    precedent: "none"
  B4:
    name: self-mitigation
    family: B
    what: "a % damage reduction on yourself — converts to a protection-equivalent through `combat.mitigation`"
    precedent: "none"
  B5:
    name: per-second-damage
    family: B
    what: "a standing aura dealing damage per second — per-hit via `attacks_per_second`, but only against enemies inside its radius"
    precedent: "none"
  C1:
    name: health-state
    family: C
    what: "the grant exists only above, below or in proportion to a health fraction — uptime is time spent there"
    precedent: "none (CONDITIONAL_MARKERS refuses it on purpose)"
  C2:
    name: self-trigger
    family: C
    what: "a timed buff on your own cast, hit or crit — the trigger rate is kit-derivable, the uptime needs the fight clock §4.12 refused"
    precedent: "none"
  C3:
    name: enemy-trigger
    family: C
    what: "fires on what the enemy does to you (hit by, CC'd, enemies in range) — a property of the attacker, of which a build score contains none"
    precedent: "none"
  C4:
    name: outcome-trigger
    family: C
    what: "fires on a kill or assist — the trigger is the outcome the win signal measures, so any rate for it is §1's leakage"
    precedent: "none"
  C5:
    name: cooldown-gated
    family: C
    what: "an active, or a proc with its own cooldown — worth (fight length / cooldown) uses, which is the clock §4.12 refused"
    precedent: "none"
  C6:
    name: persistent-stack
    family: C
    what: "value accrues over the match and is kept — register §4.8, measured and shipped off"
    precedent: "price_stacks (off)"
  D1:
    name: ally-directed
    family: D
    what: "an aura, heal, shield or buff whose value lands on allies — a per-god score has no ally in it; the draft does"
    precedent: "none"
  D2:
    name: enemy-debuff
    family: D
    what: "reduces the enemy's damage output, attack speed or healing — needs the attacker's build and the healing model neither instrument has"
    precedent: "none"
  E1:
    name: control-utility
    family: E
    what: "crowd control, immunity, mobility, stealth, vision, wards, gold, a consumable — a game-state change with no damage or effective-health expression"
    precedent: "none (tags are the instrument)"
  E2:
    name: summon
    family: E
    what: "a summoned unit with its own health and damage"
    precedent: "none"

